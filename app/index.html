    if (HHD) { const old = HHD; HHD = null; await old.close(); }
    if (!hasCore()) { HHD = localOnlyHousehold(); SYNC = HHD.status(); return; }
    SYNC = SYNC0();
    HHD = await FF.openHousehold({
      code,
      syncUrl: syncUrl(),
      onChange: hh => adopt(hh),
      onStatus: onSyncStatus
    });
    SYNC = { ...SYNC0(), ...(HHD.status?.() || {}) };
  }

  // Daten der WG übernehmen (beim Start oder wenn ein anderes Gerät etwas geändert hat)
  function adopt(hh) {
    if (!hh) return;
    const photos = new Map((S.feed || []).filter(f => f.photo).map(f => [f.id, f.photo]));
    const rel = shiftWeeks(hh, -CUR);
    for (const k of HH_KEYS) S[k] = rel[k] ?? EMPTY[k]();
    S.feed.forEach(f => { if (photos.has(f.id)) f.photo = photos.get(f.id); });
    S.feed.sort((a, b) => b.at - a.at);
    normalize();
    if (uiBusy()) pendingRender = true; else render();
  }
  // Fotos bleiben auf dem Gerät, auf dem sie aufgenommen wurden (zu groß für den Sync)
  function hhOf() {
    const out = {};
    for (const k of HH_KEYS) out[k] = S[k];
    out.feed = S.feed.slice(0, 200).map(f => ({ ...f, photo: undefined }));
    return shiftWeeks(out, CUR);
  }
  function normalize() {
    if (!S.settings) return;
    S.notes ||= {}; S.settings.rating ||= DEFAULT_SETTINGS(null).rating; if (S.settings.rating.notes === undefined) S.settings.rating.notes = true;
    // Ältere Daten können Aufträge an Leute außerhalb der WG enthalten: nur Vertretungen unter Mitbewohnern bleiben
    S.jobs = (S.jobs || []).filter(j => j.key && !j.ext && T(j.key.split(":")[0]) && (!j.taker || isMember(j.taker)) && !(j.status === "open" && j.to));
  }
  // Nicht neu zeichnen, während jemand in der Seite tippt
  const uiBusy = () => { const a = document.activeElement; return !!a && $("#app").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && a.type !== "radio"; };
  document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !uiBusy()) { pendingRender = false; render(); } }, 0));

  async function createHousehold(hh, code) {
    DEV.code = code || (hasCore() ? FF.newInviteCode() : null);
    await openHH(DEV.code);
    HHD.write(shiftWeeks(hh, CUR)); // hh hat relative Wochen wie S, im Dokument stehen sie absolut
    adopt(HHD.read());
  }
  async function leaveHousehold() {
    if (HHD) await HHD.destroy();
    HHD = null; DEV.code = null; SYNC = SYNC0();
    Object.assign(S, emptyHH(), { me: null, tab: "woche" });
    A = A0(); closeSheet(); render(); toast("Die WG ist auf diesem Gerät entfernt. Bei den anderen bleibt alles erhalten.");
  }
  // Beispiel-WG: Ansicht wechseln (in einer echten WG ist jedes Gerät eine Person)
  function switchIdentity(id) {
    if (!isMember(id)) return;
    S.me = id; render();
    toast(`Du siehst die App jetzt als ${P(S.me).name}${S.me === S.settings.admin ? " (Admin)" : ""}.`);
  }

  // ---------- Startseite: WG gründen oder beitreten ----------
  // A = Zustand der Startseite (wird nicht gespeichert)
  const A0 = () => ({ step: "start", err: "", ok: "" });
  let A = A0();
  const setA = patch => { A = { ...A, err: "", ok: "", ...patch }; render(); window.scrollTo({ top: 0 }); };
  const joinFromLink = () => { const m = location.hash.match(/join=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; };

  function appMode() {
    if (S.meta && HHD) return isMember(S.me) ? "wg" : "pick";
    if (DEV.code) return "wait";
    return "start";
  }

  function viewStart() {
    const msg = (A.err ? `<p class="err" role="alert">${esc(A.err)}</p>` : "") + (A.ok ? `<p class="okmsg" role="status">${esc(A.ok)}</p>` : "");
    const back = `<div class="links"><button type="button" class="linkbtn" data-astep="start">← Zurück</button></div>`;
    const card = html => `<div class="authcard">${html}</div>`;
    let body;
    switch (A.step) {
      case "create":
        body = card(`<h1>Neue WG gründen</h1><p class="lead">Die WG entsteht auf diesem Gerät. Danach lädst du deine Mitbewohner mit einem Code ein. Eure Daten werden auf euren Geräten verschlüsselt, der Flurfunk-Server speichert sie nur verschlüsselt und kann sie nicht lesen.</p>${msg}
          <form data-auth="create">
            <div class="field"><label for="c-wg">Name der WG</label><input id="c-wg" required maxlength="60" placeholder="z. B. WG Lindenstraße"></div>
            <div class="field"><label for="c-addr">Adresse (optional)</label><input id="c-addr" maxlength="80" autocomplete="street-address" placeholder="z. B. Lindenstraße 8"><span class="hint">Bleibt in der WG.</span></div>
            <div class="field"><label for="c-name">Dein Name</label><input id="c-name" required maxlength="60" autocomplete="name"></div>
            <button type="submit" class="btn primary">WG gründen</button>
          </form>${back}`);
        break;
      case "join":
        body = card(`<h1>Einer WG beitreten</h1><p class="lead">Gib den Einladungscode ein, den dir ein Mitbewohner zeigt (unter „Dieses Gerät“ oder in den WG-Einstellungen). Der Code ist zugleich euer gemeinsamer Schlüssel: Gib ihn nur an Leute, die bei euch wohnen.</p>${msg}
          <form data-auth="join"><div class="field"><label for="j-code">Einladungscode</label><input id="j-code" class="mono" autocomplete="off" required placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" value="${esc(A.code || joinFromLink())}" style="text-transform:uppercase"></div><button type="submit" class="btn primary">Beitreten</button></form>${back}`);
        break;
      default:
        body = `${msg}<div class="paths">
            <button type="button" data-astep="create"><b>Neue WG gründen</b><span>Du bekommst einen Einladungscode für deine Mitbewohner.</span><i aria-hidden="true">›</i></button>
            <button type="button" data-astep="join"><b>Einer WG beitreten</b><span>Mit dem Code von einem Mitbewohner.</span><i aria-hidden="true">›</i></button>
            <button type="button" data-demo><b>Mit Beispiel-WG ausprobieren</b><span>Fünf Mitbewohner und zwölf Wochen Verlauf. Teile den Code mit einem zweiten Gerät, um den Abgleich zu sehen.</span><i aria-hidden="true">›</i></button>
          </div>
          ${hasCore() ? "" : `<p class="lock">Das Sync-Modul fehlt in dieser Datei (index.html direkt geöffnet?). Die WG funktioniert dann nur auf diesem Gerät. Baue die App mit „python build_app.py“.</p>`}`;
    }
    return `<div class="onboard"><div class="hero"><span class="logo">${LOGO_SVG}</span><p class="kicker">Hausplan · füreinander da</p><h1>Flurfunk</h1><p>Putzplan, Urlaub und Vertretungen für eure WG. Eure Daten werden auf euren Geräten verschlüsselt, der Server sieht nur verschlüsselte Daten.</p></div>${body}</div>`;
  }

  function viewWaiting() {
    const st = SYNC, empty = st.online && st.synced && !st.ready;
    const head = !st.online ? "Keine Verbindung zum Sync-Server" : empty ? "Keine Daten gefunden" : "Hole die Daten deiner WG …";
    const lead = !st.online ? "Prüfe deine Internetverbindung. Flurfunk versucht es weiter und holt die Daten, sobald der Server erreichbar ist."
      : empty ? "Für diesen Code gibt es noch keine Daten auf dem Server. Prüfe den Code oder bitte einen Mitbewohner, die App einmal zu öffnen."
      : "Die verschlüsselten WG-Daten kommen vom Flurfunk-Server und werden auf diesem Gerät mit dem Code entschlüsselt.";
    return `<div class="onboard"><div class="authcard" style="text-align:center">
      ${empty ? "" : `<div class="radar" aria-hidden="true"></div>`}
      <h1>${head}</h1>
      <p class="lead">${lead}</p>
      <dl class="statlist" style="text-align:left">
        <dt>Sync-Server</dt><dd class="${st.online ? "ok" : "no"}">${st.online ? "verbunden" : "nicht erreichbar"} <span class="hint">${esc(syncUrl())}</span></dd>
        <dt>WG-Daten</dt><dd class="${st.ready ? "ok" : empty ? "no" : ""}">${st.ready ? "da" : empty ? "keine für diesen Code" : "werden gesucht …"}</dd>
      </dl>
      <div class="row" style="justify-content:center"><button type="button" class="btn" data-leave-confirm>Abbrechen</button><button type="button" class="btn quiet" data-device>Server-Einstellungen</button></div>
    </div></div>`;
  }

  function viewPick() {
    const msg = A.err ? `<p class="err" role="alert">${esc(A.err)}</p>` : "";
    return `<div class="onboard"><div class="hero"><span class="logo">${LOGO_SVG}</span><p class="kicker">Verbunden</p><h1>${esc(wgName())}</h1><p>Wer bist du? Das merkt sich nur dieses Gerät.</p></div>
      <div class="authcard">${msg}
        <div class="morelist">${S.parties.map(p => `<button type="button" data-pick="${p.id}"><span>${esc(p.name)}${p.id === S.settings.admin ? ' <span class="hint">· Admin</span>' : ""}</span><span aria-hidden="true">›</span></button>`).join("")}</div>
        <div class="or">oder neu in der WG</div>
        <form data-auth="newmember" style="display:grid;gap:10px"><div class="field"><label for="n-name">Dein Name</label><input id="n-name" required maxlength="60" autocomplete="name"></div><button type="submit" class="btn primary">Ich bin neu hier</button></form>
      </div></div>`;
  }

  // ---------- Dieses Gerät: Sync, Einladung, Server ----------
  function syncLabel() {
    if (!HHD) return null;
    if (!hasCore() || SYNC.local) return { cls: "local", text: "Nur lokal" };
    if (!SYNC.online) return { cls: "", text: "Offline" };
    if (!SYNC.synced || SYNC.pending) return { cls: "busy", text: "Wird abgeglichen" };
    return { cls: "on", text: "Verbunden" };
  }
  function updateSyncChip() {
    const el = $("#sync"), l = appMode() === "wg" ? syncLabel() : null;
    if (!el) return;
    el.hidden = !l;
    if (l) { el.className = "syncchip " + l.cls; el.innerHTML = `<i aria-hidden="true"></i>${esc(l.text)}`; el.title = "Sync und Server"; }
  }
  const inviteHtml = () => {
    const code = HHD?.info?.code;
    if (!code) return `<p class="hint">Ohne Sync-Modul gibt es keinen Einladungscode.</p>`;
    const link = location.protocol.startsWith("http") ? FF.inviteLink(code, location.origin + location.pathname) : code;
    return `<div class="qr" aria-label="QR-Code mit dem Einladungscode">${FF.qrSvg(link)}</div>
      <p class="codebox" id="invite-code">${esc(code)}</p>
      <div class="row" style="justify-content:center"><button type="button" class="btn small" data-copy="${esc(link)}">Code kopieren</button></div>
      <p class="hint">Der Code ist euer gemeinsamer Schlüssel: Wer ihn hat, sieht alle WG-Daten. Gib ihn nur an Mitbewohner. Neue sind ab der nächsten Woche im Plan.</p>`;
  };
  function sheetDevice() {
    const st = SYNC, inWg = !!(S.meta && HHD), live = hasCore() && !st.local;
    openSheet(`
      <h2>Dieses Gerät</h2>
      ${inWg && isMember(S.me) ? `<div class="profile" style="margin:0">${avatar(S.me)}<h2>${esc(P(S.me).name)}</h2><p class="meta"><span>${esc(wgName())}</span><span>${S.me === S.settings.admin ? "Admin der WG" : "Mitglied der WG"}</span></p></div>` : ""}
      <div><h3>Sync</h3><dl class="statlist">
        <dt>WG-Daten</dt><dd>${live ? "auf diesem Gerät gespeichert, auch offline nutzbar" : "nur auf diesem Gerät (ohne Sync-Modul)"}</dd>
        ${live && HHD ? `<dt>Sync-Server</dt><dd class="${st.online ? "ok" : "no"}">${st.online ? "verbunden" : "nicht erreichbar"}</dd>
        <dt>Letzter Abgleich</dt><dd>${st.lastSync ? ago(st.lastSync) : "noch keiner"}</dd>
        <dt>Änderungen</dt><dd class="${st.pending ? "" : "ok"}">${st.pending ? `${st.pending} noch nicht beim Server. Sie gehen raus, sobald die Verbindung steht.` : "alle abgeglichen"}</dd>
        <dt>Verschlüsselung</dt><dd>Ende-zu-Ende. Der Schlüssel steckt im Einladungscode und verlässt eure Geräte nicht. Der Server speichert nur verschlüsselte Daten.</dd>` : ""}
      </dl></div>
      ${inWg ? `<div style="display:grid;gap:10px"><h3>Mitbewohner einladen</h3>${inviteHtml()}</div>` : ""}
      ${hasCore() ? `<details><summary style="cursor:pointer;font-weight:600">Server-Einstellungen</summary>
        <form data-auth="server" style="display:grid;gap:10px;margin-top:10px">
          <div class="field"><label for="s-sync">Sync-Server</label><input id="s-sync" class="mono" value="${esc(DEV.server.sync)}" placeholder="${esc(defaultSync())}"><span class="hint">Leer lassen für den Standard.</span></div>
          <div class="row"><button type="submit" class="btn small">Übernehmen</button></div>
        </form>
      </details>` : ""}
      <div class="row">${inWg ? `<button type="button" class="btn quiet" data-leave-confirm>WG auf diesem Gerät entfernen</button>` : ""}<button type="button" class="btn primary" data-close-btn>Fertig</button></div>`);
  }
  function sheetInvite() { openSheet(`<h2>Mitbewohner einladen</h2>${inviteHtml()}<div class="row"><button type="button" class="btn primary" data-close-btn>Fertig</button></div>`); }

  // Formulare der Startseite und der Gerät-Ansicht
  async function authSubmit(kind, f) {
    const v = id => (f.querySelector("#" + id)?.value || "").trim();
    if (kind === "create") {
      const hh = blankHousehold(v("c-wg"), v("c-addr"), v("c-name"));
      S.me = hh.parties[0].id; S.tab = "woche";
      await createHousehold(hh);
      A = A0(); render(); sheetInvite(); toast("WG gegründet. Lade jetzt deine Mitbewohner ein.");
      return;
    }
    if (kind === "join") {
      if (!hasCore()) return setA({ err: "Zum Beitreten fehlt das Sync-Modul. Baue die App mit build_app.py." });
      const code = FF.parseInviteCode(v("j-code"));
      if (!code) return setA({ code: v("j-code"), err: "Der Code stimmt nicht. Prüfe ihn auf Tippfehler: 28 Zeichen, z. B. K7QM-3XZP-…" });
      DEV.code = code; S.me = null; await openHH(code);
      if (location.hash.includes("join=")) history.replaceState(null, "", location.pathname);
      const hh = HHD.read(); if (hh) adopt(hh); else render();
      return;
    }
    if (kind === "newmember") {
      const name = v("n-name"), p = { id: uid("w"), name, short: name.split(" ")[0], flat: "", joined: 1 };
      S.parties.push(p); S.me = p.id;
      post(p.id, `ist der WG beigetreten und ab ${weekLabel(1)} im Plan.`);
      render(); toast(`Willkommen in der ${wgName()}. Ab ${weekLabel(1)} bist du im Plan.`);
      return;
    }
    if (kind === "server") {
      const before = syncUrl();
      DEV.server = { sync: v("s-sync") };
      saveDevice(); closeSheet();
      // Mit der neuen Adresse neu verbinden: WG schließen und wieder öffnen (die Daten liegen lokal)
      if (DEV.code && hasCore() && syncUrl() !== before) {
        await openHH(DEV.code);
        const hh = HHD.read(); if (hh) adopt(hh); else render();
      }
      toast("Übernommen.");
      return;
    }
  }

  // ---------- Rendern ----------
  function render() {
    const mode = appMode();
    document.body.classList.toggle("authmode", mode !== "wg");
    updateSyncChip();
    $("#reset").hidden = !S.meta?.demo;
    $("#demo-who").hidden = !S.meta?.demo;
    if (mode !== "wg") {
      $("#tabs").hidden = true; $("#bnav").hidden = true;
      $("#sub").textContent = "";
      $("#app").innerHTML = mode === "wait" ? viewWaiting() : mode === "pick" ? viewPick() : viewStart();
      save(); return;
    }
    // Aufgabenliste: nach Ablauf der Frist automatisch verteilen
    if (S.settings.mode === "liste" && !S.distributed[0] && new Date() > distDeadline(0)) distribute(0);
    $("#acct").innerHTML = avatar(S.me);
    $("#me").innerHTML = `<optgroup label="WG">${S.parties.map(p => `<option value="${p.id}" ${p.id === S.me ? "selected" : ""}>${esc(p.name)}${p.id === S.settings.admin ? " (Admin)" : ""}</option>`).join("")}</optgroup>`;
    $("#sub").textContent = `${wgName()} · ${S.parties.length} Mitbewohner · ${S.settings.mode === "plan" ? "Putzplan" : "Aufgabenliste"}`;
    $("#tabs").hidden = false;
    const VIEWS = { woche: viewWoche, plan: viewPlan, stats: viewStats, urlaub: viewUrlaub, hilfe: viewHilfe, settings: viewSettings, ordnung: viewOrdnung, feed: viewFeed };
    if (!VIEWS[S.tab]) S.tab = "woche"; // z. B. ein Tab aus einer älteren Version
    const nOpen = nOpenWg();
    const nVac = S.vacations.filter(v => v.status === "pending" && v.who !== S.me && !v.approvals.includes(S.me) && !v.rejections.includes(S.me)).length;
    const TABS = [["woche", "Woche"], ["plan", S.settings.mode === "plan" ? "Putzplan" : "Aufgabenliste"], ["stats", "Statistik"], ["urlaub", "Urlaub", nVac], ["hilfe", "Vertretungen", nOpen], ["settings", "WG-Einstellungen"], ["ordnung", "Hausordnung"]];
    $("#tabs").innerHTML = TABS.map(([k, l, c]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${c ? `<span class="count">${c}</span>` : ""}</button>`).join("");
    const v = VIEWS[S.tab]();
    const wide = ["stats", "plan", "settings", "feed"].includes(S.tab);
    // Untere Navigation (Handy)
    const MORE = ["urlaub", "hilfe", "settings", "ordnung"];
    const nb = [["woche", "Woche", ICON.week], ["plan", S.settings.mode === "plan" ? "Plan" : "Liste", ICON.plan], ["feed", "Flurfunk", ICON.feed], ["stats", "Statistik", ICON.stats], ["more", "Mehr", ICON.more, nOpen + nVac]];
    $("#bnav").innerHTML = nb.map(([k, l, ic, c]) => `<button type="button" ${k === "more" ? "data-more" : `data-tab="${k}"`} ${(k === S.tab || (k === "more" && MORE.includes(S.tab))) ? 'aria-current="page"' : ""}>${ic}<span>${l}</span>${c ? `<span class="dot">${c}</span>` : ""}</button>`).join("");
    $("#bnav").hidden = false;
    $("#app").innerHTML = wide ? `<div class="grid wide"><div class="main">${v}</div></div>` : `<div class="grid"><div class="main">${v}</div><aside>${feedView()}</aside></div>`;
    save();
  }
  // Speichern: Geräte-Teil in localStorage, WG-Teil ins Yjs-Dokument (nur Unterschiede, verschlüsselt an den Sync-Server)
  function save() {
    saveDevice();
    if (HHD && S.meta) HHD.write(hhOf());
  }

  document.addEventListener("click", e => {
    if (e.target.matches?.("[data-close]")) { closeSheet(); return; }
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    // Gerät, WG
    if (b.id === "acct" || b.id === "sync" || d.device !== undefined) { sheetDevice(); return; }
    if (d.astep) { setA({ step: d.astep }); return; }
    if (d.demo !== undefined) {
      seed(); const hh = {}; for (const k of HH_KEYS) hh[k] = S[k];
      createHousehold(hh).then(() => { render(); toast("Beispiel-WG angelegt. Oben rechts siehst du den Sync-Status."); });
      return;
    }
    if (d.pick) { S.me = d.pick; A = A0(); render(); toast(`Hallo ${P(S.me).short}.`); return; }
    if (d.leaveConfirm !== undefined) {
      if (!DEV.code || !S.meta) { leaveHousehold(); return; }
      b.textContent = "Wirklich entfernen?"; b.className = "btn"; b.style.color = "var(--late)"; delete b.dataset.leaveConfirm; b.dataset.leave = ""; return;
    }
    if (d.leave !== undefined) { leaveHousehold(); return; }
    if (d.invite !== undefined) { sheetInvite(); return; }
    // Aufgaben und Marktplatz (nur Admin)
    if ((d.tedit || d.tsave || d.tdelAsk || d.tdel || d.market !== undefined || d.pack || d.packAdd) && !isAdmin()) { toast("Nur der Admin kann Aufgaben ändern."); return; }
    if (d.tedit) { sheetTask(d.tedit); return; }
    if (d.tsave) { if (saveTask(d.tsave)) { closeSheet(); render(); } return; }
    if (d.tdelAsk) { const id = d.tdelAsk; b.textContent = "Wirklich löschen?"; delete b.dataset.tdelAsk; b.dataset.tdel = id; return; }
    if (d.tdel) { deleteTask(d.tdel); closeSheet(); toast("Aufgabe gelöscht. Erledigtes bleibt in der Statistik."); render(); return; }
    if (d.market !== undefined) { sheetMarket(); return; }
    if (d.pack) { sheetPack(d.pack); return; }
    if (d.packAdd) { const n = addPack(d.packAdd); closeSheet(); toast(n ? `${n} ${n === 1 ? "Aufgabe" : "Aufgaben"} übernommen.` : "Nichts ausgewählt."); render(); return; }
    if (d.copy) { const t = d.copy; (navigator.clipboard?.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Kopiert."), () => toast("Bitte den Code markieren und kopieren.")); return; }
    if (d.tab) { S.tab = d.tab; closeSheet(); render(); window.scrollTo({ top: 0 }); return; }
    if (d.more !== undefined) { sheetMore(); return; }
    if (d.wk !== undefined) { S.wk = d.wk === "0" ? 0 : S.wk + Number(d.wk); render(); return; }
    if (d.range) { S.statRange = Number(d.range); render(); return; }
    if (d.claim) { S.claims[d.claim] = { by: S.me, at: now() }; post(S.me, `übernimmt diese Woche ${splitKey(d.claim)[0].title}.`); toast("Ist deins. Die anderen sehen es im Flurfunk."); render(); return; }
    if (d.unclaim) { delete S.claims[d.unclaim]; toast("Wieder freigegeben."); render(); return; }
    if (d.distribute !== undefined) { const n = distribute(Number(d.distribute)); toast(n ? `${n} ${n === 1 ? "Aufgabe" : "Aufgaben"} verteilt.` : "Es war nichts mehr frei."); render(); return; }
    if (d.rate) {
      const n = Number(d.n); S.ratings[d.rate] = { ...(S.ratings[d.rate] || {}), [S.me]: n };
      toast(`Mit ${n} ${n === 1 ? "Stern" : "Sternen"} bewertet.`); render(); return; }
    if (d.done) { pendingPhoto = null; sheetDone(d.done); return; }
    if (d.cant) { sheetCant(d.cant); return; }
    if (d.closeBtn !== undefined) { closeSheet(); return; }
    if (d.confirmDone) { markDone(d.confirmDone, $("#d-note").value.trim(), pendingPhoto); closeSheet(); render(); return; }
    if (d.confirmCant) {
      const k = d.confirmCant, [t] = splitKey(k);
      const how = $(".sheet input[name=how]:checked").value, note = $("#c-note").value.trim();
      if (how === "paid") {
        const price = Math.max(0, Math.round(Number($("#c-amount").value) || 0));
        createJob(k, { price, note });
        post(S.me, `sucht eine Vertretung für ${t.title}${price ? ` (${eur(price)})` : ""}.`); toast("Anfrage steht im Flurfunk.");
      }
      if (how === "swap") {
        const r = { id: "r" + now(), key: k, from: S.me, type: "swap", to: $("#c-to").value, note, at: now(), status: "open" };
        S.requests.unshift(r); post(S.me, `möchte ${t.title} mit ${P(r.to).short} tauschen.`); toast(`${P(r.to).short} wurde gefragt.`);
      }
      closeSheet(); render(); return;
    }
    if (d.take) { d.take.startsWith("r") ? takeSwap(d.take) : takeJob(d.take); render(); return; }
    if (d.jcancel) { const j = S.jobs.find(x => x.id === d.jcancel); if (!j) return; const was = j.status; cancelJob(j); if (was === "confirmed") post(S.me, `hat die Vertretung für ${jobTitle(j)} wieder abgesagt.`); toast(was === "confirmed" ? `Abgesagt. Die Aufgabe ist wieder bei dir.` : "Anfrage zurückgezogen."); render(); return; }
    if (d.cancel) { const r = S.requests.find(x => x.id === d.cancel); if (r) r.status = "cancelled"; toast("Anfrage zurückgezogen."); render(); return; }
    if (d.jpaid) { const j = S.jobs.find(x => x.id === d.jpaid); j.paid = true; post(S.me, `hat ${P(j.taker).short} ${eur(j.price)} für ${jobTitle(j)} bezahlt.`); render(); return; }
    if (d.jdone) { pendingPhoto = null; sheetDone(null, d.jdone); return; }
    if (d.nudge) { const [t, wk] = splitKey(d.nudge), who = assignee(t, wk); S.nudged[d.nudge + S.me] = true; post(S.me, `erinnert ${P(who).short} freundlich an ${t.title}.`); toast(`${P(who).short} bekommt eine freundliche Erinnerung.`); render(); return; }
    if (d.thx) { const f = S.feed.find(x => x.id === d.thx); if (f) { const i = f.thanks.indexOf(S.me); i < 0 ? f.thanks.push(S.me) : f.thanks.splice(i, 1); } render(); return; }
    // Urlaub
    if (b.id === "u-save") {
      const from = Number($("#u-from").value), len = Number($("#u-len").value), reason = $("#u-reason").value.trim();
      const pre = vacPreview(from, len); if (pre.startsWith("In diesem Zeitraum")) { toast(pre); return; }
      const left = Math.max(0, S.settings.vacation.weeks - usedStandard(S.me, yearOf(from)));
      const v = { id: "v" + now(), who: S.me, from, to: from + len - 1, approvals: [], rejections: [], reason, at: now() };
      if (len <= left) { v.type = "standard"; v.status = "approved"; post(S.me, `ist ${weekRange(v.from, v.to)} im Urlaub. Die Aufgaben werden auf die anderen verteilt.`); toast("Urlaub eingetragen. Die Aufgaben sind neu verteilt."); }
      else { v.type = "extra"; v.status = "pending"; post(S.me, `beantragt zusätzlichen Urlaub für ${weekRange(v.from, v.to)}.`); toast(`Antrag gestellt. ${S.settings.vacation.approval === "all" ? "Alle anderen müssen" : "Eine Person muss"} zustimmen.`); }
      S.vacations.push(v); render(); return;
    }
    if (d.vyes || d.vno) {
      const v = S.vacations.find(x => x.id === (d.vyes || d.vno));
      (d.vyes ? v.approvals : v.rejections).push(S.me);
      const res = settleVacation(v);
      toast(res === "approved" ? `Urlaub von ${P(v.who).short} ist genehmigt.` : res === "rejected" ? `Antrag von ${P(v.who).short} ist abgelehnt.` : d.vyes ? "Zugestimmt. Es fehlen noch weitere Zustimmungen." : "Abgelehnt.");
      render(); return;
    }
    if (d.vcancel) { const v = S.vacations.find(x => x.id === d.vcancel); v.status = "cancelled"; toast("Urlaub entfernt."); render(); return; }
  });

  document.addEventListener("change", e => {
    const el = e.target;
    // Beispiel-WG: Ansicht wechseln (in einer echten WG ist jedes Gerät eine Person)
    if (el.id === "me") { switchIdentity(el.value); return; }
    if (el.id === "te-every") { const m = el.value === "m"; $("#te-days-f").hidden = !m; $("#te-due-f").hidden = m; return; }
    if (el.name === "how") document.querySelectorAll(".subopt").forEach(s => { s.hidden = s.dataset.for !== el.value; });
    if (el.id === "u-from" || el.id === "u-len") { $("#u-preview").textContent = vacPreview(Number($("#u-from").value), Number($("#u-len").value)); return; }
    if (el.id === "d-photo") {
      const f = el.files?.[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => { pendingPhoto = rd.result; const img = $("#d-prev"); img.src = rd.result; img.hidden = false; }; rd.readAsDataURL(f);
      return;
    }
    // Einstellungen (nur Admin)
    if (!isAdmin()) return;
    const s = S.settings; let changed = true;
    if (el.name === "s-mode") {
      s.mode = el.value;
      if (s.mode === "liste") { S.claims = {}; S.distributed = {}; }
      post(S.me, s.mode === "plan" ? "hat auf Putzplan mit fester Reihenfolge umgestellt." : "hat auf Aufgabenliste zum Selbernehmen umgestellt.");
    }
    else if (el.id === "s-dist") s.distDay = Number(el.value);
    else if (el.dataset.pts) T(el.dataset.pts).points = Number(el.value);
    else if (el.id === "s-r-on") s.rating.enabled = el.checked;
    else if (el.id === "s-r-notes") s.rating.notes = el.checked;
    else if (el.name === "s-r-who") s.rating.who = el.value;
    else if (el.id === "s-r-anon") s.rating.anonymous = el.checked;
    else if (el.id === "s-r-stats") s.rating.inStats = el.checked;
    else if (el.id === "s-v-weeks") s.vacation.weeks = Math.max(0, Math.min(12, Number(el.value) || 0));
    else if (el.name === "s-v-appr") { s.vacation.approval = el.value; S.vacations.filter(v => v.status === "pending").forEach(settleVacation); }
    else if (el.id === "s-admin") { s.admin = el.value; post(S.me, `hat ${P(el.value).short} zur Admin gemacht.`); }
    else changed = false;
    if (changed) { render(); toast("Gespeichert. Gilt sofort für alle."); }
  });
  document.addEventListener("submit", e => {
    const af = e.target.closest("form[data-auth]");
    if (af) { e.preventDefault(); authSubmit(af.dataset.auth, af); return; }
    const f = e.target.closest("form[data-note]"); if (!f) return;
    e.preventDefault();
    const text = f.querySelector("input").value.trim(); if (!text) return;
    (S.notes[f.dataset.note] ||= []).push({ by: S.me, text, at: now() });
    toast("Anmerkung gespeichert."); render();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer").innerHTML) closeSheet(); });
  $("#reset").addEventListener("click", () => {
    if (!S.meta?.demo) return;
    const me = S.me; seed(); if (isMember(me)) S.me = me;
    render(); toast("Beispieldaten wiederhergestellt, auch auf den anderen Geräten.");
  });

  // ---------- Start ----------
  async function boot() {
    loadDevice();
    S = { ...localDefaults(), ...Object.fromEntries(LOCAL_KEYS.filter(k => DEV.local?.[k] !== undefined).map(k => [k, DEV.local[k]])), ...emptyHH() };
    $("#logo").innerHTML = LOGO_SVG;
    let raw = null, old = null;
    try { raw = localStorage.getItem(KEY); old = JSON.parse(raw); } catch {}
    if (!DEV.code && old?.settings && old?.parties) {
      // Einmalige Übernahme der bisherigen Daten (früher lag alles in localStorage)
      const hh = {};
      for (const k of HH_KEYS) hh[k] = old[k] ?? EMPTY[k]();
      hh.meta = { id: uid("hh"), name: "WG Lindenstraße 8", address: "Lindenstraße 8", created: now(), demo: true, migrated: true, schema: 1 };
      // Nur Vertretungen unter Mitbewohnern übernehmen (normalize() räumt den Rest auf)
      hh.jobs = (old.jobs || []).filter(j => j.key);
      hh.feed = (old.feed || []).slice(0, 200);
      const acct = (old.accounts || []).find(a => a.id === old.session);
      Object.assign(S, Object.fromEntries(LOCAL_KEYS.filter(k => old[k] !== undefined).map(k => [k, old[k]])));
      if (acct?.person) S.me = acct.person;
      await createHousehold(hh);
      await HHD.flush?.();
      try { localStorage.setItem(KEY + "-backup", raw); localStorage.removeItem(KEY); } catch {}
      setTimeout(() => toast("Deine bisherigen Daten liegen jetzt in der lokalen WG-Datenbank. Lade Mitbewohner über „Dieses Gerät“ ein."), 400);
    } else if (DEV.code) {
      await openHH(DEV.code);
      if (HHD.read()) adopt(HHD.read());
    }
    if (joinFromLink() && !DEV.code) A = { ...A0(), step: "join" };
    render();
  }
  boot().catch(e => { console.error(e); $("#app").innerHTML = `<p class="err">Flurfunk konnte nicht starten: ${esc(e.message)}</p>`; });
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
