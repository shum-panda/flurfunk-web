  --accent: #8CC4B2; --accent-ink: #102019; --accent-soft: #1C2D27;
  --help: #E9BC5C; --help-soft: #2E2510; --late: #EE8C86; --late-soft: #33191A;
  --ext: #B9A3F0; --ext-soft: #241D38; --vac: #8CC3E0; --vac-soft: #15262F;
  --me: #18213A; --me-line: #8FA9EC; --star: #E9BC5C; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1140px; margin: 0 auto; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 18px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
.brand span { color: var(--muted); font-size: 14px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.who select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--ink); font-weight: 600; max-width: 260px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 11px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .count { font-family: var(--f-mono); font-size: 12px; background: var(--help-soft); color: var(--help); border-radius: 10px; padding: 0 7px; margin-left: 6px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.grid.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.main { display: grid; gap: 16px; min-width: 0; }

.weekbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.weekbar h1, .section-title { font-size: clamp(22px, 3.2vw, 28px); font-weight: 700; }
.weekbar .range { font-family: var(--f-mono); font-size: 14px; color: var(--muted); }
.pager { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
h2.sub-title { font-size: 17px; font-weight: 700; margin-top: 8px; }

.banner { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-radius: 10px; background: var(--me); border: 1px solid var(--line); font-size: 15px; }
.banner.vac { background: var(--vac-soft); border-color: transparent; }
.banner.list { background: var(--accent-soft); border-color: transparent; }

.tasks { display: grid; gap: 10px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 14px; }
.task.mine { border-color: var(--me-line); box-shadow: inset 3px 0 0 var(--me-line); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #fff; grid-row: span 3; flex: none; }
.avatar.free { background: none !important; border: 2px dashed var(--line); color: var(--muted); }
.task h3 { font-size: 18px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pts { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.detail { color: var(--muted); font-size: 15px; }
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta b { color: var(--ink); font-weight: 600; }
.actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px; letter-spacing: 0.01em; white-space: nowrap; }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.pill.open { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.late { background: var(--late-soft); color: var(--late); }
.pill.help { background: var(--help-soft); color: var(--help); }
.pill.vac { background: var(--vac-soft); color: var(--vac); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.help { background: var(--help-soft); border-color: transparent; color: var(--help); }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }

/* Bewertung */
.ratebox { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 14px; color: var(--muted); margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.rate { display: inline-flex; gap: 0; }
.rate button { background: none; border: 0; cursor: pointer; font-size: 22px; color: var(--line); padding: 0 3px; line-height: 1; }
.rate button.on { color: var(--star); }
.stars { color: var(--star); letter-spacing: 1px; }

/* Flurfunk */
aside { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0; }
@media (max-width: 900px) { aside { position: static; } }
aside h2 { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
aside h2 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.feed { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.feed li { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 10px; font-size: 14px; }
.feed li:last-child { border-bottom: 0; }
.feed .avatar { width: 28px; height: 28px; font-size: 11px; grid-row: span 2; }
.feed time { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.feed .thx { display: flex; gap: 8px; align-items: center; }
.feed .thx button { border: 1px solid var(--line); background: none; border-radius: 20px; padding: 0 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.feed .thx button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.feed img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 6px; grid-column: 2; }

/* Tabellen */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
th.wk { font-family: var(--f-mono); font-weight: 500; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tr:last-child td, tr:last-child th { border-bottom: 0; }
td.me { background: var(--me); font-weight: 600; }
td.cur, th.cur { box-shadow: inset 0 2px 0 var(--accent); }
td small { display: block; font-size: 11px; color: var(--help); font-weight: 600; }
td small.v { color: var(--vac); }
td.free { color: var(--muted); font-style: italic; }
tr.vacrow td, tr.vacrow th { background: var(--vac-soft); color: var(--vac); font-size: 13px; }

/* Statistik */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--muted); font-family: var(--f-body); }
.card .amt { font-family: var(--f-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-size: 16px; font-weight: 700; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 54px; gap: 12px; align-items: center; font-size: 14px; }
@media (max-width: 520px) { .hbar { grid-template-columns: 84px minmax(0, 1fr) 48px; } }
.hbar .track { height: 14px; position: relative; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .val { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .nm small { color: var(--vac); font-size: 12px; display: block; }
.heat td.c { text-align: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 64px; }
.heat td.z { color: var(--muted); }
.ledger { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ledger li { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 15px; }
.ledger li:last-child { border-bottom: 0; }
.ledger .grow { flex: 1; min-width: 180px; }
.ledger .avatar { width: 32px; height: 32px; font-size: 12px; }

/* Urlaub */
.allow { display: grid; gap: 6px; }
.allow .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; display: flex; gap: 2px; }
.allow .track i { display: block; height: 100%; background: var(--vac); }
.allow .track i.pend { background: var(--help); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }

/* Einstellungen */
.settings { display: grid; gap: 14px; max-width: 760px; }
.set { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.set h2 { font-size: 17px; font-weight: 700; }
.set .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
.set .row:first-of-type { border-top: 0; padding-top: 0; }
.set .row p { font-size: 14px; color: var(--muted); grid-column: 1; }
.set .row label.t { font-weight: 600; }
@media (max-width: 560px) { .set .row { grid-template-columns: minmax(0, 1fr); } .set .row.trow { grid-template-columns: minmax(0, 1fr) auto; } }
.switch { position: relative; width: 44px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 12px; transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled { cursor: default; }
.radios { display: flex; flex-wrap: wrap; gap: 8px; }
.radios label { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 15px; }
.radios label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radios input { accent-color: var(--accent); margin: 0; }
.lock { background: var(--help-soft); color: var(--help); padding: 10px 14px; border-radius: 10px; font-size: 14px; }
select.sm, input.sm { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input.sm[type="number"] { width: 80px; font-family: var(--f-mono); }

/* Dieses Gerät */
.profile { background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.profile .avatar { width: 56px; height: 56px; grid-row: span 2; font-size: 18px; }
.profile h1 { font-size: 24px; font-weight: 700; }

.rules { display: grid; gap: 10px; max-width: 70ch; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.rule h3 { font-size: 16px; font-weight: 600; }
.rule p { color: var(--muted); font-size: 15px; }
.lead { color: var(--muted); max-width: 70ch; }
.hint { font-size: 13px; color: var(--muted); }

/* Dialog */
.overlay { position: fixed; inset: 0; background: rgba(10, 12, 12, .45); display: grid; place-items: end center; z-index: 20; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .overlay { place-items: center; } }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 540px; max-height: 90vh; overflow: auto; border-radius: 16px; padding: 20px; display: grid; gap: 16px; }
.sheet h2 { font-size: 21px; font-weight: 700; }
.choice { display: grid; gap: 8px; }
.choice > label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.choice > label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice > label input { margin-top: 3px; accent-color: var(--accent); }
.choice strong { font-weight: 600; }
.choice small { grid-column: 2; color: var(--muted); font-size: 14px; }
.subopt { display: grid; gap: 10px; padding-left: 30px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field input[type="number"] { font-family: var(--f-mono); max-width: 140px; }
.sheet .row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.photo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.photo img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 30; max-width: calc(100% - 32px); }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }

/* Bewertung und Anmerkungen */
.ratebox { display: grid; gap: 8px; }
.rateline { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.ratebox ul.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; color: var(--ink); }
.ratebox ul.notes li { padding: 6px 10px; background: var(--bg); border-radius: 8px; font-size: 14px; }
.noteform { display: flex; gap: 6px; }
.noteform input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 14px; }

/* Untere Navigation: nur auf dem Handy */
.bottom { display: none; }
.bottom button { flex: 1; display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 8px 2px 6px; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; position: relative; }
.bottom svg { width: 24px; height: 24px; }
.bottom button[aria-current="page"] { color: var(--accent); }
.bottom .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--help); color: var(--surface); font-size: 10px; display: grid; place-items: center; padding: 0 4px; font-family: var(--f-mono); }
.morelist { display: grid; gap: 6px; }
.daypick { display: flex; gap: 6px; flex-wrap: wrap; }
.daypick label { position: relative; }
.daypick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.daypick span { display: inline-grid; place-items: center; min-width: 44px; height: 40px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; }
.daypick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.daypick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.morelist button { display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; font-weight: 600; cursor: pointer; }

@media (max-width: 700px) {
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); font-size: 16px; }
  .top { padding-block: 12px 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 12; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 13; background: var(--bg); }
  .brand b { font-size: 21px; }
  .brand #sub { display: none; }
  .who select { max-width: 180px; font-size: 14px; }
  .who label { display: none; }
  .syncchip { padding: 4px 8px; letter-spacing: .04em; }
  .tabs, aside { display: none !important; }
  .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
  .btn { min-height: 44px; }
  .btn.small { min-height: 36px; }
  .task { padding: 14px; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 12px; }
  .task .avatar { width: 36px; height: 36px; font-size: 13px; }
  .actions, .ratebox { grid-column: 1 / -1; }
  .actions .btn { flex: 1 1 auto; }
  .weekbar .pager .icon-btn { padding: 8px 12px; }
  .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  footer { margin-top: 24px; }
  .mobile-feed h2 { display: none; }
}
@media (min-width: 701px) { .only-mobile { display: none; } }

/* Startseite und Gerät */
.acct { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; }
.acct .avatar { width: 34px; height: 34px; font-size: 13px; }
body.authmode .who, body.authmode .acct, body.authmode footer { display: none; }
.authcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.authcard h1 { font-size: 26px; font-weight: 700; }
.authcard form { display: grid; gap: 12px; }
.authcard .btn { min-height: 44px; }
.authcard .links { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.err { background: var(--late-soft); color: var(--late); padding: 9px 12px; border-radius: 8px; font-size: 14px; }
.okmsg { background: var(--accent-soft); color: var(--accent); padding: 9px 12px; border-radius: 8px; font-size: 14px; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.sheet h3 { font-size: 15px; font-weight: 700; font-family: var(--f-body); }

/* Retro-Futur, dezent: Logo mit Leuchten, Kapsel-Knöpfe, ein warmer Bernstein-Akzent, Statusanzeige in Mono */
:root { --retro: #C9731F; --retro-soft: #FBEEDD; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --retro: #F0A75A; --retro-soft: #33261A; } }
:root[data-theme="dark"] { --retro: #F0A75A; --retro-soft: #33261A; }
body { background: radial-gradient(1100px 360px at 50% -170px, var(--accent-soft), transparent 72%) no-repeat, var(--bg); }
.brand { align-items: center; }
.logo { width: 34px; height: 34px; flex: none; display: block; align-self: center; filter: drop-shadow(0 3px 8px color-mix(in srgb, var(--accent) 35%, transparent)); }

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAY = 864e5, HOUR = 36e5;
  const now = () => Date.now();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y) / DAY + 1) / 7);
  }
  const mondayOf = d => { const s = startOfDay(d); const k = (s.getDay() + 6) % 7; return new Date(s.getFullYear(), s.getMonth(), s.getDate() - k); };
  const fmtD = d => d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  const wday = d => d.toLocaleDateString("de-DE", { weekday: "short" });
  const ago = t => { const m = Math.round((now() - t) / 6e4); if (m < 1) return "gerade eben"; if (m < 60) return `vor ${m} Min.`; const h = Math.round(m / 60); if (h < 24) return `vor ${h} Std.`; const d = Math.round(h / 24); return d === 1 ? "gestern" : `vor ${d} Tagen`; };
  const eur = n => (Math.round(n * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + " €";
  const num1 = n => n.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const DAYS = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];

  const BASE = mondayOf(new Date());
  const CUR = Math.round((BASE - new Date(2024, 0, 1)) / (7 * DAY)); // Wochen seit Montag, 1. Januar 2024
  const weekStart = i => new Date(BASE.getFullYear(), BASE.getMonth(), BASE.getDate() + i * 7);
  const weekLabel = i => `KW ${isoWeek(weekStart(i))}`;
  const weekRange = (a, b) => a === b ? weekLabel(a) : `${weekLabel(a)}–${isoWeek(weekStart(b))}`;
  const COLORS = ["#7A4E9C", "#2F6E8F", "#3B5BA9", "#A0522D", "#2E7D5B"];

  // ---------- Zustand ----------
  // S ist der Zustand im Speicher. Er setzt sich aus zwei Teilen zusammen:
  //   1. WG-Daten (HH_KEYS): liegen im Yjs-Dokument der WG, lokal gespeichert und verschlüsselt über den Sync-Server abgeglichen

  let S;
  const KEY = "flurfunk-proto-v8"; // alter Speicherort vor dem Sync-Umbau, wird einmalig übernommen
  // jobs = Vertretungen unter Mitbewohnern
  const HH_KEYS = ["meta", "settings", "parties", "tasks", "vacations", "overrides", "done", "ratings", "notes", "claims", "distributed", "requests", "feed", "nudged", "jobs"];
  const LOCAL_KEYS = ["me", "tab", "wk", "statRange"];
  const DEFAULT_TASKS = () => [
    { id: "treppe", title: "Treppenhaus wischen", detail: "Alle Etagen feucht wischen, Geländer und Briefkästen abwischen.", due: 5, every: 1, points: 3, price: 15, doneText: "hat das Treppenhaus gewischt." },

    { id: "muell", title: "Mülltonnen rausstellen", detail: "Restmüll und Bio am Abend vor der Leerung an die Straße, nach der Leerung zurück in den Hof.", due: 1, every: 1, points: 1, price: 8, doneText: "hat die Mülltonnen rausgestellt." },

  ];
  // Wie oft eine Aufgabe dran ist, in Wochen. offset verteilt seltene Aufgaben übers Jahr (Rest der absoluten Woche).
  const EVERY = [[1, "jede Woche"], [2, "alle 2 Wochen"], [3, "alle 3 Wochen"], [4, "monatlich"], [8, "alle 2 Monate"], [13, "vierteljährlich"], [26, "halbjährlich"], [52, "jährlich"]];
  const everyTxt = n => (EVERY.find(e => e[0] === n) || [0, `alle ${n} Wochen`])[1];
  const DSHORT = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  // Mehrmals pro Woche: t.days = Wochentage. Jeder Tag ist eine eigene Einheit (id "aufgabe~tag") mit eigenem Termin und eigener Person.
  const isMulti = t => Array.isArray(t.days) && t.days.length > 1;
  const freqTxt = t => isMulti(t) ? `${t.days.length}× pro Woche (${t.days.slice().sort().map(d => DSHORT[d]).join(", ")})` : everyTxt(t.every || 1);
  const unitOf = (t, d) => ({ ...t, id: `${t.id}~${d}`, base: t.id, due: d, every: 1, offset: 0, title: `${t.title} (${DSHORT[d]})` });
  const units = t => isMulti(t) ? t.days.slice().sort().map(d => unitOf(t, d)) : [t];
  const PTS_TXT = ["leicht", "mittel", "aufwendig"];
  // Marktplatz: Aufgabenpakete zum Übernehmen. [Titel, Beschreibung, alle n Wochen, fällig bis Wochentag (0 = Mo), Aufwand]
  const PACKS = [
    { id: "wohnung", name: "Kleine Wohnung", desc: "Für Wohnungen und WGs, in denen sich das Aufteilen nach Räumen nicht lohnt.", tasks: [
      ["Boden saugen und wischen", "Alle Räume saugen, danach feucht wischen. Teppiche nur saugen.", 1, 5, 3],
      ["Bad putzen", "WC, Waschbecken, Dusche oder Wanne und Spiegel. Handtücher wechseln.", 1, 5, 3],
      ["Küche putzen", "Arbeitsflächen, Herd, Spüle und Fronten abwischen, Spüllappen wechseln.", 1, 6, 2],
      ["Müll rausbringen", "Restmüll, Bio und Gelber Sack, wenn voll. Neue Tüten einlegen.", 1, 3, 1],
      ["Altpapier und Altglas wegbringen", "Zum Container oder in die Tonne.", 2, 5, 1],
      ["Staubwischen", "Regale, Fensterbänke, Lampen und Türrahmen.", 2, 5, 1],
      ["Spülmaschine ausräumen", "Sauberes Geschirr in die Schränke, Geschirr aus der Spüle einräumen.", 1, 4, 1, [0, 1, 2, 3, 4]],
      ["Haushaltsvorrat auffüllen", "Spülmittel, Müllbeutel, Toilettenpapier und Putzmittel prüfen und nachkaufen.", 2, 4, 1]
    ] },
    { id: "jahr", name: "Grundreinigung übers Jahr", desc: "Seltene Aufgaben, die sonst vergessen werden. Sie werden über die Wochen verteilt.", tasks: [
      ["Kühlschrank auswischen", "Ausräumen, Fächer und Dichtungen auswischen, Abgelaufenes wegwerfen.", 26, 5, 2],
      ["Backofen reinigen", "Innenraum, Bleche und Gitter.", 13, 5, 2],
      ["Fenster putzen", "Innen und außen, Rahmen und Fensterbänke.", 13, 5, 3],
      ["Filter der Dunstabzugshaube reinigen", "In die Spülmaschine oder in heißem Wasser mit Spülmittel einweichen.", 13, 5, 1],
      ["Waschmaschine reinigen", "Leerwäsche bei 90 °C, Gummidichtung und Flusensieb sauber machen.", 4, 5, 1],
      ["Abflüsse reinigen", "Haare aus Dusche und Waschbecken holen, Spüle mit heißem Wasser durchspülen.", 4, 5, 1],
      ["Wasserkocher und Kaffeemaschine entkalken", "Mit Zitronensäure oder Entkalker.", 4, 5, 1],
      ["Mülleimer auswaschen", "Alle Eimer ausspülen und trocknen lassen.", 4, 5, 1],
      ["Duschvorhang und Badematte waschen", "In die Waschmaschine, 40 °C.", 13, 5, 1],
      ["Heizkörper entstauben", "Mit Heizkörperbürste oder Staubsauger zwischen den Rippen.", 26, 5, 1],
      ["Gefrierfach abtauen", "Ausräumen, abtauen lassen, auswischen.", 52, 5, 2]
    ] },
    { id: "keller", name: "Keller und Abstellraum", desc: "Zusätzlich, wenn zur Wohnung ein Keller oder Waschraum gehört.", tasks: [
      ["Keller und Waschraum", "Boden fegen, Flusensieb des Trockners leeren, kurz lüften.", 2, 6, 2],
      ["Abstellraum aufräumen", "Aussortieren, was keiner mehr braucht, Boden fegen.", 13, 6, 2]
    ] },
    { id: "haus", name: "Mehrparteienhaus", desc: "Was laut Hausordnung reihum anfällt: Treppenhaus, Gehweg, Tonnen.", tasks: [
      ["Treppenhaus wischen", "Alle Etagen feucht wischen, Geländer und Briefkästen abwischen.", 1, 5, 3],
      ["Mülltonnen rausstellen", "Am Abend vor der Leerung an die Straße, nach der Leerung zurück.", 1, 1, 1],
      ["Gehweg und Hof fegen", "Gehweg vor dem Haus und Hof. Im Winter: Schnee räumen bis 7 Uhr.", 1, 5, 2]
    ] },
    { id: "garten", name: "Haus mit Garten", desc: "Für ein eigenes Haus mit Garten und Einfahrt.", tasks: [
      ["Rasen mähen", "In der Saison, etwa April bis Oktober. Im Winter einfach als erledigt melden.", 2, 5, 3],
      ["Beete und Unkraut", "Unkraut jäten, Pflanzen gießen, wenn es nicht regnet.", 4, 5, 2],
      ["Einfahrt und Gehweg fegen", "Im Winter: Schnee räumen und streuen.", 1, 5, 2],
      ["Mülltonnen rausstellen", "Am Abend vor der Leerung an die Straße, nach der Leerung zurück.", 1, 1, 1],
      ["Dachrinne und Abflüsse prüfen", "Laub entfernen, im Frühjahr und im Herbst.", 26, 5, 3]
    ] }
  ];
  const DEFAULT_SETTINGS = admin => ({ admin, mode: "plan", distDay: 3, rating: { enabled: true, who: "alle", anonymous: true, inStats: true, notes: true }, vacation: { weeks: 4, approval: "one" } });
  const uid = p => p + now().toString(36) + Math.random().toString(36).slice(2, 7);
  const localDefaults = () => ({ me: null, tab: "woche", wk: 0, statRange: 12 });

  // Neue, leere WG
  function blankHousehold(name, address, myName) {
    const me = uid("w");
    return {
      meta: { id: uid("hh"), name, address: address || "", created: now(), schema: 1 },
      settings: DEFAULT_SETTINGS(me),
      parties: [{ id: me, name: myName, short: myName.split(" ")[0], flat: "" }],
      tasks: DEFAULT_TASKS(), vacations: [], overrides: {}, done: {}, ratings: {}, notes: {}, claims: {}, distributed: {},
      requests: [], feed: [{ id: uid("f"), at: now(), by: me, text: `hat ${name} in Flurfunk angelegt.`, thanks: [] }],

    };

  function seed() {
    const t = now();
    S = {
      ...localDefaults(), me: "w3",
      meta: { id: "demo", name: "WG Lindenstraße 8", address: "Lindenstraße 8", created: t, demo: true, schema: 1 },
      settings: {
        admin: "w4",
        mode: "plan",            // plan = feste Rotation, liste = jeder nimmt sich selbst

        rating: { enabled: true, who: "alle", anonymous: true, inStats: true, notes: true },
        vacation: { weeks: 4, approval: "one" }
      },
      parties: [
        { id: "w1", name: "Ayşe Yilmaz", short: "Ayşe", flat: "Zimmer 1" },
        { id: "w2", name: "Klaus Becker", short: "Klaus", flat: "Zimmer 2" },
        { id: "w3", name: "Mehmet Aydın", short: "Mehmet", flat: "Zimmer 3" },
        { id: "w4", name: "Lena Vogt", short: "Lena", flat: "Zimmer 4" },
        { id: "w5", name: "Jonas Hartmann", short: "Jonas", flat: "Zimmer 5" }
      ],
      // due = Wochentag (0 = Mo), every = alle n Wochen, points = Aufwand
      tasks: DEFAULT_TASKS(),
      vacations: [
        { id: "v1", who: "w1", from: -6, to: -5, type: "standard", status: "approved", approvals: [], rejections: [], at: t - 50 * DAY },
        { id: "v2", who: "w2", from: 1, to: 1, type: "standard", status: "approved", approvals: [], rejections: [], at: t - 6 * DAY },
        { id: "v3", who: "w5", from: 4, to: 5, type: "extra", status: "pending", approvals: ["w4"], rejections: [], reason: "Praktikum in Lissabon, zwei Wochen vor Ort.", at: t - 2 * DAY }
      ],
      overrides: {}, done: {}, ratings: {}, notes: {}, claims: {}, distributed: {},
      requests: [], feed: [], nudged: {},
      // Vertretungen unter Mitbewohnern
      jobs: []
    };
    // Verlauf der letzten 12 Wochen erzeugen (fester Zufall, damit es bei jedem Laden gleich aussieht)
    let a = 7; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
    const quality = { w1: 4.6, w2: 3.7, w3: 4.2, w4: 4.8, w5: 3.9 };
    const rateKey = (k, by, wk) => {
      const raters = present(wk).map(p => p.id).filter(id => id !== by).sort(() => rnd() - 0.5).slice(0, 1 + Math.floor(rnd() * 3));
      const r = {}; raters.forEach(id => { r[id] = Math.max(2, Math.min(5, Math.round(quality[by] + (rnd() - 0.5) * 1.6))); }); S.ratings[k] = r;
    };
    for (let wk = -12; wk <= -1; wk++) for (const task of S.tasks) {
      if (!active(task, wk)) continue;
      const k = keyOf(task.id, wk), base = planAssign(task, wk); if (!base) continue;

    // Vorletzte Woche: Hof als Gefallen, ohne Bezahlung
    const hof2 = planAssign(T("hof"), -2), hofBy = ["w1", "w3", "w5"].find(id => id !== hof2 && !onVac(id, -2));
    S.overrides["hof:-2"] = { by: hofBy, type: "paid" }; S.done["hof:-2"].by = hofBy; rateKey("hof:-2", hofBy, -2);
    S.jobs.push({ id: "j1", key: "hof:-2", from: hof2, price: 0, note: "Bin übers Wochenende bei meinen Eltern.", audience: "wg", to: null, taker: hofBy, status: "done", pay: "direkt", at: t - 13 * DAY, doneAt: S.done["hof:-2"].at });
    // Diese Woche
    const hof0 = planAssign(T("hof"), 0);
    const [r1, r2] = ["w4", "w2", "w1"].filter(id => id !== hof0);
    S.done["hof:0"] = { at: t - 20 * HOUR, by: hof0 }; S.ratings["hof:0"] = { [r1]: 5, [r2]: 4 };

    const tp2 = keyOf("treppe", -2);
    S.notes[tp2] = [{ by: "w1", text: "Geländer im 2. OG wurde vergessen.", at: S.done[tp2].at + 5 * HOUR }, { by: S.done[tp2].by, text: "Stimmt, mache ich nächstes Mal mit.", at: S.done[tp2].at + 8 * HOUR }];
    // Keller ist nur jede zweite Woche dran; sonst sucht jemand für die Küche eine Vertretung
    const vt = active(T("keller"), 0) ? T("keller") : T("kueche"), kel0 = planAssign(vt, 0);
    S.jobs.push({ id: "j2", key: keyOf(vt.id, 0), from: kel0, price: 12, note: "Ich habe diese Woche Prüfungen und komme kaum nach Hause.", audience: "wg", to: null, taker: null, status: "open", at: t - 30 * HOUR });

    S.requests.push({ id: "r1", key: "muell:1", from: mu1, type: "swap", to: muTo, note: "Bin Montag erst spät zurück.", at: t - 26 * HOUR, status: "open" });
    S.feed = [

      { id: "f0", at: t - 10 * DAY, by: hofBy, text: `hat Gehweg und Hof für ${P(hof2).short} gefegt.`, thanks: [hof2] }
    ];

  // ---------- Grundfunktionen ----------
  const isMember = id => S.parties.some(p => p.id === id);
  // Unbekannte Personen (z. B. aus älteren Daten) als Platzhalter, damit nichts abstürzt
  const UNKNOWN = id => ({ id, name: "Unbekannt", short: "Unbekannt", unknown: true });
  const P = id => S.parties.find(p => p.id === id) || (id && id !== "sys" ? UNKNOWN(id) : undefined);
  const T = id => { const [b, d] = String(id).split("~"); const t = S.tasks.find(x => x.id === b); return !t || d === undefined ? t : unitOf(t, Number(d)); };
  const TASKS = () => S.tasks.flatMap(units);
  const ofTask = (k, tid) => k.startsWith(tid + ":") || k.startsWith(tid + "~");
  const keyOf = (tid, wk) => `${tid}:${wk}`;
  // Gelöschte Aufgaben: alte Einträge (Verlauf, Flurfunk) sollen weiter funktionieren
  const GONE = id => ({ id, title: "Gelöschte Aufgabe", detail: "", due: 6, every: 1, offset: 0, points: 1, doneText: "hat eine Aufgabe erledigt.", gone: true });
  const splitKey = k => { const [tid, wk] = k.split(":"); return [T(tid) || GONE(tid), Number(wk)]; };
  // Wochen sind in S relativ zur aktuellen Woche (0 = diese Woche), im WG-Dokument absolut (CUR + wk).
  // So meinen zwei Geräte mit derselben Zahl dieselbe Woche, egal wann sie die App geöffnet haben.
  const active = (t, wk) => { const n = t.every || 1; return (((wk + CUR - (t.offset || 0)) % n) + n) % n === 0; };
  const nextWeek = t => { for (let w = 0; w <= (t.every || 1); w++) if (active(t, w)) return w; return 0; };
  // Seltene Aufgabe in die Woche legen, in der bisher am wenigsten Aufwand anfällt
  function spreadOffset(t, others) {
    const n = t.every || 1; if (n === 1) return 0;
    let best = 0, bestLoad = Infinity;
    for (let w = 0; w < n; w++) {
      const load = others.filter(o => o !== t && (o.every || 1) > 1 && active(o, w)).reduce((s, o) => s + o.points, 0);
      if (load < bestLoad) { best = w; bestLoad = load; }
    }
    return (((CUR + best) % n) + n) % n;
  }
  const doneTextOf = title => `hat „${title}“ erledigt.`;
  const dueDate = (t, wk) => { const m = weekStart(wk); return new Date(m.getFullYear(), m.getMonth(), m.getDate() + t.due, 20); };
  const isAdmin = () => S.me === S.settings.admin;

  const onVac = (id, wk) => S.vacations.some(v => v.who === id && v.status === "approved" && wk >= v.from && wk <= v.to);
  const present = wk => S.parties.filter(p => !onVac(p.id, wk) && (p.joined ?? -Infinity) <= wk);

  // Feste Rotation über alle, die in dieser Woche da sind
  function planAssign(t, wk) {
    const pr = present(wk); if (!pr.length) return null;
    const act = TASKS().filter(x => active(x, wk)), i = Math.max(0, act.findIndex(x => x.id === t.id)), n = pr.length;
    return pr[(((wk + CUR + i + 2) % n) + n) % n].id;
  }
  function baseAssign(t, wk) {
    const k = keyOf(t.id, wk);
    if (S.settings.mode === "plan") return planAssign(t, wk);
    return S.claims[k]?.by || S.done[k]?.by || null;
  }
  const assignee = (t, wk) => S.overrides[keyOf(t.id, wk)]?.by || baseAssign(t, wk);

  // ---------- Vertretungen ----------
  // Wer eine Aufgabe nicht schafft, gibt sie an die WG ab (S.jobs): als Gefallen (Betrag 0) oder gegen einen Betrag,
  // den die Mitbewohner direkt untereinander zahlen. Tauschen bleibt eine eigene Anfrage (S.requests).
  // Ablauf: open → confirmed → done, oder cancelled
  const wgName = () => S.meta?.name || "Eure WG";
  const jobFor = k => S.jobs.find(j => j.key === k && ["open", "confirmed", "done"].includes(j.status));
  const swapFor = k => S.requests.find(r => r.key === k && r.status === "open");
  const jobTitle = j => splitKey(j.key)[0].title;
  const priceTxt = p => p ? eur(p) : "als Gefallen";
  const canTake = (id, j) => j.status === "open" && !!j.key && !j.to && j.from !== id && isMember(id) && !onVac(id, splitKey(j.key)[1]);
  const nOpenWg = () => S.jobs.filter(j => canTake(S.me, j)).length + S.requests.filter(r => r.status === "open" && r.to === S.me).length;

  // Aufgabenliste: Wer bekommt die übrigen Aufgaben? Die mit dem wenigsten Aufwand diese Woche.
  function weekLoad(id, wk) {
    return TASKS().filter(t => active(t, wk)).reduce((s, t) => { const k = keyOf(t.id, wk); return s + ((S.claims[k]?.by === id && !S.overrides[k]) || S.overrides[k]?.by === id || S.done[k]?.by === id ? t.points : 0); }, 0);
  }
  function forecast(wk) {
    const pr = present(wk); if (!pr.length) return {};
    const load = Object.fromEntries(pr.map(p => [p.id, weekLoad(p.id, wk)]));
    const recent = id => { let s = 0; for (let w = wk - 4; w < wk; w++) for (const t of TASKS()) if (S.done[keyOf(t.id, w)]?.by === id) s += t.points; return s; };
    const open = TASKS().filter(t => active(t, wk) && !assignee(t, wk) && !S.done[keyOf(t.id, wk)]).sort((a, b) => b.points - a.points);
    const out = {};
    for (const t of open) {
      const pick = pr.slice().sort((a, b) => load[a.id] - load[b.id] || recent(a.id) - recent(b.id))[0];
      out[keyOf(t.id, wk)] = pick.id; load[pick.id] += t.points;
    }
    return out;
  }
  const distDeadline = wk => { const m = weekStart(wk); return new Date(m.getFullYear(), m.getMonth(), m.getDate() + S.settings.distDay, 12); };
  function distribute(wk, silent) {
    const f = forecast(wk), keys = Object.keys(f);
    keys.forEach(k => { S.claims[k] = { by: f[k], auto: true, at: now() }; });
    S.distributed[wk] = true;
    if (keys.length && !silent) post("sys", `hat die übrigen Aufgaben verteilt: ${keys.map(k => `${splitKey(k)[0].title} an ${P(f[k]).short}`).join(", ")}.`);
    return keys.length;
  }

  const colorOf = id => { const i = S.parties.findIndex(p => p.id === id); return i < 0 ? "#62666B" : COLORS[i % COLORS.length]; };
  const avatar = id => id ? `<span class="avatar" style="background:${colorOf(id)}" aria-hidden="true">${id === "sys" ? "FF" : esc(P(id).short.slice(0, 2))}</span>` : `<span class="avatar free" aria-hidden="true">?</span>`;
  const nameOf = id => id === "sys" ? "Flurfunk" : P(id).short;
  const youOr = id => id === S.me ? "Du" : id === "sys" ? "Flurfunk" : P(id).short;
  const stars = r => `<span class="stars" aria-label="${num1(r)} von 5 Sternen">${"★".repeat(Math.round(r))}${"☆".repeat(5 - Math.round(r))}</span>`;
  const avgOf = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;
  const ratingsOfKey = k => Object.values(S.ratings[k] || {});

  function status(t, wk) {
    const k = keyOf(t.id, wk), d = S.done[k], r = swapFor(k), b = jobFor(k), who = assignee(t, wk);
    if (d) return { cls: "done", label: "Erledigt" };
    if (b?.status === "confirmed") return { cls: "help", label: `${P(b.taker).short} übernimmt` };
    if (b?.status === "open") return { cls: "help", label: b.price ? `Vertretung gesucht · ${eur(b.price)}` : "Vertretung gesucht" };
    if (r) return { cls: "help", label: "Tausch angefragt" };
    if (!who) return { cls: "open", label: "Frei" };
    if (dueDate(t, wk) < new Date()) return { cls: "late", label: "Überfällig" };
    if (S.claims[k]?.auto) return { cls: "open", label: "Zugeteilt" };
    return { cls: "open", label: S.settings.mode === "liste" ? "Übernommen" : "Offen" };
  }

  function post(by, text, extra = {}) { S.feed.unshift({ id: "f" + now() + Math.random().toString(36).slice(2, 6), at: now(), by, text, thanks: [], ...extra }); }
  function toast(msg) { document.querySelectorAll(".toast").forEach(t => t.remove()); const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg; document.body.append(el); setTimeout(() => el.remove(), 3600); }

  // ---------- Bewertung ----------
  function canRate(k) {
    const d = S.done[k], R = S.settings.rating;
    return !!d && R.enabled && d.by !== S.me && (R.who === "alle" || isAdmin());
  }
  function rateWidget(k) {
    const R = S.settings.rating, d = S.done[k];
    if (!d) return "";
    const showRating = R.enabled, showNotes = R.notes;
    if (!showRating && !showNotes) return "";
    let out = "";
    if (showRating) {
      const rs = S.ratings[k] || {}, vals = Object.values(rs), avg = avgOf(vals), mine = rs[S.me];
      const who = !R.anonymous && vals.length ? ` · von ${Object.keys(rs).map(id => esc(youOr(id))).join(", ")}` : "";
      const summary = vals.length ? `${stars(avg)} ${num1(avg)} aus ${vals.length} ${vals.length === 1 ? "Bewertung" : "Bewertungen"}${who}` : "Noch nicht bewertet";
      const widget = canRate(k) ? `<span>${mine ? "Deine Bewertung:" : "Wie gut ist es geworden?"}</span><span class="rate" role="group" aria-label="Bewerten">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="${mine >= n ? "on" : ""}" data-rate="${k}" data-n="${n}" aria-label="${n} Sterne" aria-pressed="${mine === n}">★</button>`).join("")}</span>` : "";
      out += `<div class="rateline"><span>${summary}</span>${widget}</div>`;
    }
    if (showNotes) {
      const ns = S.notes[k] || [];
      if (ns.length) out += `<ul class="notes">${ns.map(n => `<li>„${esc(n.text)}“ <span class="hint">${R.anonymous && n.by !== d.by ? "anonym" : esc(youOr(n.by))} · ${ago(n.at)}</span></li>`).join("")}</ul>`;
      out += `<form class="noteform" data-note="${k}"><input id="n-${k}" type="text" maxlength="200" aria-label="Anmerkung" placeholder="${d.by === S.me ? "Antworten …" : "Anmerkung, z. B. Geländer im 2. OG vergessen"}"><button type="submit" class="btn small">Senden</button></form>`;
    }
    return `<div class="ratebox">${out}</div>`;
  }

  // ---------- Woche ----------
  function viewWoche() {
    const wk = S.wk, list = TASKS().filter(t => active(t, wk));
    const liste = S.settings.mode === "liste";
    const meAway = onVac(S.me, wk);
    const away = S.parties.filter(p => onVac(p.id, wk));
    const mine = list.filter(t => assignee(t, wk) === S.me && !S.done[keyOf(t.id, wk)]);
    const free = list.filter(t => !assignee(t, wk) && !S.done[keyOf(t.id, wk)]);
    const nHelp = nOpenWg();
    const m = weekStart(wk), e = new Date(m.getFullYear(), m.getMonth(), m.getDate() + 6);
    const fc = liste ? forecast(wk) : {};
    let banner = "";
    if (meAway) banner = `<div class="banner vac"><span>Du bist ${wk === 0 ? "diese Woche" : "in dieser Woche"} im Urlaub. Du hast keine Aufgaben, und in der Statistik zählt die Woche nicht.</span></div>`;
    else if (wk >= 0) banner = `<div class="banner"><span>${mine.length ? `Du hast ${wk === 0 ? "diese Woche" : "in dieser Woche"} <b>${mine.length} ${mine.length === 1 ? "Aufgabe" : "Aufgaben"}</b> offen.` : `Du hast ${wk === 0 ? "diese Woche" : "in dieser Woche"} nichts offen.`}${nHelp && wk === 0 ? ` ${nHelp === 1 ? "Jemand sucht" : `${nHelp} suchen`} eine Vertretung.` : ""}</span>${nHelp && wk === 0 ? `<button type="button" class="btn help" data-tab="hilfe">Ansehen</button>` : ""}</div>`;
    const vacBanner = away.length && !meAway ? `<div class="banner vac"><span>${away.map(p => esc(p.short)).join(", ")} ${away.length === 1 ? "ist" : "sind"} im Urlaub. Die Aufgaben sind auf ${present(wk).length} Personen verteilt.</span></div>` : "";
    const listBanner = liste && wk >= 0 && free.length ? `<div class="banner list"><span><b>Aufgabenliste:</b> Nimm dir, was du machen willst. Was bis ${DAYS[S.settings.distDay]}, 12 Uhr frei ist, geht an die, die diese Woche am wenigsten gemacht haben.</span>${isAdmin() && wk === 0 ? `<button type="button" class="btn small" data-distribute="0">Jetzt verteilen (Demo)</button>` : ""}</div>` : "";
    return `
      <div class="weekbar">
        <div><h1>${wk === 0 ? "Diese Woche" : wk === 1 ? "Nächste Woche" : wk === -1 ? "Letzte Woche" : weekLabel(wk)}</h1><span class="range">${weekLabel(wk)} · ${fmtD(m)}–${fmtD(e)}</span></div>
        <div class="pager"><button type="button" class="icon-btn" data-wk="-1">← Zurück</button>${wk !== 0 ? `<button type="button" class="icon-btn" data-wk="0">Heute</button>` : ""}<button type="button" class="icon-btn" data-wk="1">Weiter →</button></div>
      </div>
      ${banner}${vacBanner}${listBanner}
      <div class="tasks">${list.map(t => taskCard(t, wk, fc)).join("")}</div>`;
  }

  function taskCard(t, wk, fc) {
    const k = keyOf(t.id, wk), who = assignee(t, wk), st = status(t, wk), d = S.done[k], r = swapFor(k), b = jobFor(k), ov = S.overrides[k], cl = S.claims[k];
    const liste = S.settings.mode === "liste";
    const owner = b ? b.from : r ? r.from : who;
    const isMine = owner === S.me, due = dueDate(t, wk), meAway = onVac(S.me, wk);
    const acts = [];
    if (!d && wk >= -1) {
      if (!who && !meAway) acts.push(`<button type="button" class="btn primary" data-claim="${k}">Übernehme ich</button>`, `<button type="button" class="btn" data-done="${k}">Schon erledigt</button>`);
      if (isMine && !r && !b) {
        acts.push(`<button type="button" class="btn primary" data-done="${k}">Erledigt</button>`, `<button type="button" class="btn" data-cant="${k}">Schaffe ich nicht</button>`);
        if (liste && cl && !cl.auto && !ov) acts.push(`<button type="button" class="btn quiet" data-unclaim="${k}">Wieder freigeben</button>`);
      }
      if (isMine && r) acts.push(`<button type="button" class="btn primary" data-done="${k}">Doch selbst erledigt</button>`, `<button type="button" class="btn quiet" data-cancel="${r.id}">Anfrage zurückziehen</button>`);
      if (isMine && b?.status === "open") acts.push(`<button type="button" class="btn primary" data-done="${k}">Doch selbst erledigt</button>`, `<button type="button" class="btn quiet" data-jcancel="${b.id}">Anfrage zurückziehen</button>`);
      if (isMine && b?.status === "confirmed") acts.push(`<button type="button" class="btn quiet" data-jcancel="${b.id}">Absagen</button>`);
      if (!isMine && b?.status === "open" && canTake(S.me, b)) acts.push(`<button type="button" class="btn help" data-take="${b.id}">${b.price ? `Übernehmen für ${eur(b.price)}` : "Übernehmen"}</button>`);
      if (b?.status === "confirmed" && b.taker === S.me) acts.push(`<button type="button" class="btn primary" data-jdone="${b.id}">Erledigt</button>`);
      if (!isMine && r && r.to === S.me && !meAway) acts.push(`<button type="button" class="btn help" data-take="${r.id}">Tausch annehmen</button>`);
      if (!isMine && who && !b && st.cls === "late" && !S.nudged[k + S.me]) acts.push(`<button type="button" class="btn quiet" data-nudge="${k}">Freundlich erinnern</button>`);
    }
    let byline = who ? `<b>${esc(youOr(who))}</b>` : `<b>Noch frei</b>`;
    if (b?.status === "confirmed" || b?.status === "done") byline += ` · Vertretung für ${esc(youOr(b.from))}`;
    else if (ov?.type === "swap") byline += " · getauscht";
    else if (cl?.auto) byline += " · automatisch zugeteilt";
    const forecastLine = !who && !d && fc[k] ? `<p class="hint" style="grid-column:2">Geht am ${DAYS[S.settings.distDay]} an ${esc(youOr(fc[k]))}, wenn sie bis dahin niemand nimmt.</p>` : "";
    return `
      <article class="task ${isMine ? "mine" : ""}">
        ${avatar(who)}
        <h3>${esc(t.title)} <span class="pts" title="Aufwand">${"●".repeat(t.points)}${"○".repeat(3 - t.points)}</span> <span class="pill ${st.cls}">${esc(st.label)}</span></h3>
        <p class="detail">${esc(t.detail)}</p>
        <p class="meta"><span>${byline}</span><span>${d ? `erledigt ${ago(d.at)}${d.by !== who ? ` von ${esc(youOr(d.by))}` : ""}` : `bis ${wday(due)}, ${fmtD(due)}`}</span>${t.every > 1 ? `<span>${everyTxt(t.every)}</span>` : ""}</p>
        ${forecastLine}
        ${(b?.status === "open" ? b.note : r?.note) ? `<p class="detail" style="grid-column:2">„${esc(b?.status === "open" ? b.note : r.note)}“</p>` : ""}
        ${acts.length ? `<div class="actions">${acts.join("")}</div>` : ""}
        ${rateWidget(k)}
      </article>`;
  }

  // ---------- Plan ----------
  function viewPlan() {
    const liste = S.settings.mode === "liste";
    const weeks = liste ? [-4, -3, -2, -1, 0, 1, 2, 3] : [-1, 0, 1, 2, 3, 4, 5, 6];
    return `
      <h1 class="section-title">${liste ? "Aufgabenliste" : "Putzplan"}</h1>
      <p class="lead">${liste ? "Jeder nimmt sich in der Woche selbst Aufgaben. Hier siehst du, wer was gemacht hat und wer was übernommen hat." : "Die Aufgaben wechseln jede Woche reihum unter allen, die da sind. Wer im Urlaub ist, wird übersprungen."} Deine Felder sind markiert.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Aufgabe</th>${weeks.map(w => `<th class="wk ${w === 0 ? "cur" : ""}">${weekLabel(w)}</th>`).join("")}</tr></thead>
        <tbody>${TASKS().filter(t => weeks.some(w => active(t, w))).map(t => `<tr><th scope="row" style="color:var(--ink)">${esc(t.title)}</th>${weeks.map(w => {
          if (!active(t, w)) return `<td class="${w === 0 ? "cur" : ""}" style="color:var(--muted)">–</td>`;
          const k = keyOf(t.id, w), d = S.done[k], who = d ? d.by : assignee(t, w), ov = S.overrides[k], b = jobFor(k);
          if (!who) return `<td class="free ${w === 0 ? "cur" : ""}">frei</td>`;
          const resp = b ? b.from : who;
          const tag = b ? (b.status === "open" ? `<small>gesucht</small>` : `<small>für ${esc(P(b.from).short)}</small>`) : ov ? `<small>${ov.type === "swap" ? "getauscht" : "Vertretung"}</small>` : S.claims[k]?.auto ? `<small>zugeteilt</small>` : "";
          return `<td class="${resp === S.me ? "me" : ""} ${w === 0 ? "cur" : ""}">${esc(nameOf(who))}${d && w >= 0 ? " ✓" : ""}${tag}</td>`;
        }).join("")}</tr>`).join("")}
        <tr class="vacrow"><th scope="row">Im Urlaub</th>${weeks.map(w => `<td class="${w === 0 ? "cur" : ""}">${S.parties.filter(p => onVac(p.id, w)).map(p => esc(p.short)).join(", ") || "–"}</td>`).join("")}</tr>
        </tbody>
      </table></div>
      <p class="hint">● Aufwand pro Aufgabe, festgelegt in den WG-Einstellungen.</p>
      ${(() => { const rare = TASKS().filter(t => !weeks.some(w => active(t, w))).sort((a, b) => nextWeek(a) - nextWeek(b)); return rare.length ? `
      <h2 class="section-title" style="font-size:19px;margin-top:18px">Seltene Aufgaben</h2>
      <ul class="ledger">${rare.map(t => `<li><span class="grow"><b>${esc(t.title)}</b><br><span class="hint">${everyTxt(t.every)}</span></span><span class="pill open">${weekLabel(nextWeek(t))}</span></li>`).join("")}</ul>` : ""; })()}`;
  }

  // ---------- Statistik ----------
  function statsData(range) {
    const from = -range + 1, to = 0, R = S.settings.rating;
    const rows = S.parties.map(p => {
      const keys = Object.keys(S.done).filter(k => { const [, w] = splitKey(k); return S.done[k].by === p.id && w >= from && w <= to; });
      const pts = keys.reduce((s, k) => s + splitKey(k)[0].points, 0);
      const vacW = Array.from({ length: range }, (_, i) => from + i).filter(w => onVac(p.id, w)).length;
      const presentW = range - vacW;
      const rated = keys.flatMap(ratingsOfKey);
      const forOthers = keys.filter(k => ["paid", "swap"].includes(S.overrides[k]?.type)).length;
      const handed = S.jobs.filter(j => j.from === p.id && j.key && ["confirmed", "done"].includes(j.status) && splitKey(j.key)[1] >= from && splitKey(j.key)[1] <= to).length + S.requests.filter(r => r.from === p.id && r.status === "taken" && splitKey(r.key)[1] >= from).length;
      const byTask = Object.fromEntries(S.tasks.map(t => [t.id, keys.filter(k => ofTask(k, t.id)).length]));
      return { p, n: keys.length, pts, vacW, presentW, perWeek: presentW ? pts / presentW : 0, avg: avgOf(rated), nRated: rated.length, forOthers, handed, byTask };
    });
    // Wie schnell wird eine Aufgabe erledigt (Tage nach Wochenbeginn)
    const speed = S.tasks.map(t => {
      const ds = Object.keys(S.done).filter(k => ofTask(k, t.id) && splitKey(k)[1] >= from).map(k => (S.done[k].at - weekStart(splitKey(k)[1]).getTime()) / DAY);
      return { t, d: avgOf(ds) };
    });
    return { rows, speed, from, to, showRating: R.enabled && R.inStats };
  }

  function viewStats() {
    const range = S.statRange, D = statsData(range);
    const total = D.rows.reduce((s, r) => s + r.n, 0);
    const allR = D.rows.flatMap(r => Object.keys(S.done).filter(k => S.done[k].by === r.p.id && splitKey(k)[1] >= D.from).flatMap(ratingsOfKey));
    const sorted = D.rows.slice().sort((a, b) => b.perWeek - a.perWeek);
    const maxPW = Math.max(0.1, ...sorted.map(r => r.perWeek));
    const maxCell = Math.max(1, ...D.rows.flatMap(r => Object.values(r.byTask)));
    const heat = v => v ? `background: color-mix(in srgb, var(--accent) ${Math.round(10 + 38 * v / maxCell)}%, var(--surface))` : "";
    const maxSpeed = Math.max(1, ...D.speed.map(s => s.d || 0));
    return `
      <div class="weekbar">
        <div><h1 class="section-title">Statistik</h1><span class="range">${weekLabel(D.from)} bis ${weekLabel(D.to)}</span></div>
        <div class="seg" role="group" aria-label="Zeitraum">${[[4, "4 Wochen"], [8, "8 Wochen"], [12, "12 Wochen"]].map(([n, l]) => `<button type="button" data-range="${n}" aria-pressed="${range === n}">${l}</button>`).join("")}</div>
      </div>
      <div class="cards">
        <div class="card"><h3>Erledigt in der WG</h3><span class="amt">${total}</span><span class="hint">Aufgaben im Zeitraum</span></div>
        ${D.showRating ? `<div class="card"><h3>Ø Bewertung WG</h3><span class="amt">${allR.length ? num1(avgOf(allR)) : "–"}</span><span class="hint">${allR.length} Bewertungen</span></div>` : ""}
        <div class="card"><h3>Urlaubswochen</h3><span class="amt">${D.rows.reduce((s, r) => s + r.vacW, 0)}</span><span class="hint">werden nicht mitgezählt</span></div>
      </div>

      <section class="panel">
        <h2>Aufwand pro anwesender Woche</h2>
        <p class="hint">Punkte nach Aufwand, geteilt durch die Wochen, in denen die Person da war. Urlaub ist damit kein Nachteil.</p>
        <div class="hbars">${sorted.map(r => `
          <div class="hbar" title="${esc(r.p.name)}: ${r.pts} Punkte in ${r.presentW} Wochen">
            <span class="nm">${esc(r.p.short)}${r.p.id === S.me ? " (du)" : ""}${r.vacW ? `<small>${r.vacW} ${r.vacW === 1 ? "Woche" : "Wochen"} Urlaub</small>` : ""}</span>
            <span class="track"><span class="fill" style="width:${(r.perWeek / maxPW) * 100}%"></span></span>
            <span class="val">${num1(r.perWeek)}</span>
          </div>`).join("")}</div>
      </section>

      <section class="panel">
        <h2>Übersicht</h2>
        <div class="tablewrap" style="border:0">
          <table>
            <thead><tr><th>Person</th><th class="num">Erledigt</th><th class="num">Punkte</th><th class="num">Anwesend</th>${D.showRating ? `<th class="num">Ø Bewertung</th>` : ""}<th class="num">Für andere</th><th class="num">Abgegeben</th></tr></thead>
            <tbody>
              ${D.rows.map(r => `<tr><td>${esc(r.p.short)}${r.p.id === S.me ? " (du)" : ""}</td><td class="num">${r.n}</td><td class="num">${r.pts}</td><td class="num">${r.presentW} Wo.</td>${D.showRating ? `<td class="num">${r.avg ? num1(r.avg) + " ★" : "–"}</td>` : ""}<td class="num">${r.forOthers}</td><td class="num">${r.handed}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
        <p class="hint">„Für andere“: als Vertretung oder Tausch übernommen. „Abgegeben“: an Mitbewohner weitergegeben.</p>
      </section>

      <section class="panel">
        <h2>Wer hat was gemacht</h2>
        <div class="tablewrap heat" style="border:0">
          <table>
            <thead><tr><th>Person</th>${S.tasks.map(t => `<th class="num">${esc(t.title.split(" ")[0])}</th>`).join("")}</tr></thead>
            <tbody>
              ${D.rows.map(r => `<tr><td>${esc(r.p.short)}</td>${S.tasks.map(t => { const v = r.byTask[t.id]; return `<td class="c ${v ? "" : "z"}" style="${heat(v)}" title="${esc(r.p.short)}: ${v}× ${esc(t.title)}">${v}</td>`; }).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2>Wie schnell wird was erledigt</h2>
        <p class="hint">Durchschnittlich so viele Tage nach Wochenbeginn. ${S.settings.mode === "liste" ? "Beliebte Aufgaben sind schnell weg, die übrigen werden verteilt." : "In der Aufgabenliste zeigt das, welche Aufgaben beliebt sind."}</p>
        <div class="hbars">${D.speed.slice().sort((a, b) => (a.d ?? 9) - (b.d ?? 9)).map(s => `
          <div class="hbar" title="${esc(s.t.title)}: Ø ${s.d != null ? num1(s.d) : "–"} Tage">
            <span class="nm">${esc(s.t.title.split(" ")[0])}</span>
            <span class="track"><span class="fill" style="width:${((s.d || 0) / maxSpeed) * 100}%"></span></span>
            <span class="val">${s.d != null ? num1(s.d) + " T" : "–"}</span>
          </div>`).join("")}</div>
      </section>
      ${!D.showRating ? `<p class="hint">Bewertungen sind in den WG-Einstellungen ${S.settings.rating.enabled ? "aus der Statistik ausgeblendet" : "ausgeschaltet"}.</p>` : ""}`;
  }

  // ---------- Urlaub ----------
  const yearOf = wk => weekStart(wk).getFullYear();
  function usedStandard(id, year) {
    let n = 0; for (const v of S.vacations) if (v.who === id && v.type === "standard" && v.status === "approved") for (let w = v.from; w <= v.to; w++) if (yearOf(w) === year) n++;
    return n;
  }
  function viewUrlaub() {
    const V = S.settings.vacation, year = yearOf(0), used = usedStandard(S.me, year), left = Math.max(0, V.weeks - used);
    const mine = S.vacations.filter(v => v.who === S.me && v.to >= 0 && v.status !== "rejected" && v.status !== "cancelled");
    const pending = S.vacations.filter(v => v.status === "pending");
    const upcoming = S.vacations.filter(v => v.status === "approved" && v.to >= 0).sort((a, b) => a.from - b.from);
    const others = id => S.parties.filter(p => p.id !== id).length;
    const need = v => S.settings.vacation.approval === "all" ? `${v.approvals.length} von ${others(v.who)} Zustimmungen` : `braucht 1 Zustimmung${v.approvals.length ? " (erteilt)" : ""}`;
    return `
      <h1 class="section-title">Urlaub</h1>
      <p class="lead">Jeder hat ${V.weeks} ${V.weeks === 1 ? "Woche" : "Wochen"} Standardurlaub im Jahr. Die werden sofort eingetragen. Wer mehr braucht, beantragt zusätzlichen Urlaub. Den müssen ${V.approval === "all" ? "alle anderen" : "eine andere Person aus der WG"} bestätigen. Während des Urlaubs werden die Aufgaben auf die anderen verteilt, und die Woche zählt nicht in der Statistik.</p>
      <section class="panel">
        <h2>Dein Standardurlaub ${year}</h2>
        <div class="allow">
          <div class="track" role="img" aria-label="${used} von ${V.weeks} Wochen genommen">${Array.from({ length: V.weeks }, (_, i) => `<i style="flex:1;${i < used ? "" : "background:var(--line)"}"></i>`).join("")}</div>
          <span class="hint">${used} von ${V.weeks} Wochen genommen · ${left} übrig</span>
        </div>
        <div class="form">
          <div class="field"><label for="u-from">Ab</label><select id="u-from">${Array.from({ length: 26 }, (_, i) => `<option value="${i}">${weekLabel(i)} · ab ${fmtD(weekStart(i))}</option>`).join("")}</select></div>
          <div class="field"><label for="u-len">Dauer</label><select id="u-len">${[1, 2, 3, 4].map(n => `<option value="${n}">${n} ${n === 1 ? "Woche" : "Wochen"}</option>`).join("")}</select></div>
          <div class="field"><label for="u-reason">Grund (nur bei zusätzlichem Urlaub nötig)</label><input id="u-reason" type="text" placeholder="z. B. Praktikum, Familienbesuch"></div>
          <button type="button" class="btn primary" id="u-save">Eintragen</button>
        </div>
        <p class="hint" id="u-preview">${vacPreview(0, 1)}</p>
      </section>
      ${pending.length ? `<h2 class="sub-title">Offene Anträge</h2><ul class="ledger">${pending.map(v => {
        const mineV = v.who === S.me, voted = v.approvals.includes(S.me) || v.rejections.includes(S.me);
        return `<li>${avatar(v.who)}<span class="grow"><b>${esc(youOr(v.who))}</b> · zusätzlicher Urlaub ${weekRange(v.from, v.to)}<br><span class="hint">${v.reason ? `„${esc(v.reason)}“ · ` : ""}${need(v)}${v.approvals.length ? ` · zugestimmt: ${v.approvals.map(id => esc(youOr(id))).join(", ")}` : ""}</span></span>${mineV ? `<button type="button" class="btn quiet small" data-vcancel="${v.id}">Zurückziehen</button>` : voted ? `<span class="pill open">${v.approvals.includes(S.me) ? "Du hast zugestimmt" : "Du hast abgelehnt"}</span>` : `<button type="button" class="btn primary small" data-vyes="${v.id}">Zustimmen</button><button type="button" class="btn quiet small" data-vno="${v.id}">Ablehnen</button>`}</li>`;
      }).join("")}</ul>` : ""}
      <h2 class="sub-title">Eingetragener Urlaub</h2>
      ${upcoming.length ? `<ul class="ledger">${upcoming.map(v => `<li>${avatar(v.who)}<span class="grow"><b>${esc(youOr(v.who))}</b> · ${weekRange(v.from, v.to)}<br><span class="hint">${v.type === "standard" ? "Standardurlaub" : "zusätzlicher Urlaub"} · Aufgaben verteilt auf ${present(v.from).length} Personen</span></span><span class="pill vac">${v.from <= 0 && v.to >= 0 ? "jetzt" : "geplant"}</span>${v.who === S.me && v.from > 0 ? `<button type="button" class="btn quiet small" data-vcancel="${v.id}">Absagen</button>` : ""}</li>`).join("")}</ul>` : `<p class="hint">Gerade ist kein Urlaub eingetragen.</p>`}`;
  }
  function vacPreview(from, len) {
    const V = S.settings.vacation, used = usedStandard(S.me, yearOf(from)), left = Math.max(0, V.weeks - used);
    const overlap = S.vacations.some(v => v.who === S.me && ["approved", "pending"].includes(v.status) && !(from + len - 1 < v.from || from > v.to));
    if (overlap) return "In diesem Zeitraum hast du schon Urlaub eingetragen oder beantragt.";
    if (len <= left) return `Standardurlaub: wird sofort eingetragen. Danach hast du noch ${left - len} ${left - len === 1 ? "Woche" : "Wochen"} übrig.`;
    return `${len - left} ${len - left === 1 ? "Woche liegt" : "Wochen liegen"} über deinem Standardurlaub. Der Antrag gilt als zusätzlicher Urlaub und braucht die Zustimmung von ${V.approval === "all" ? "allen anderen" : "einer Person aus der WG"}.`;
  }
  function settleVacation(v) {
    const others = S.parties.filter(p => p.id !== v.who).length, all = S.settings.vacation.approval === "all";
    if (all ? v.approvals.length >= others : v.approvals.length >= 1) { v.status = "approved"; post(v.who, `hat zusätzlichen Urlaub ${weekRange(v.from, v.to)}. Die Aufgaben werden verteilt.`); return "approved"; }
    if (all ? v.rejections.length >= 1 : v.rejections.length >= others) { v.status = "rejected"; return "rejected"; }
    return "pending";
  }

  // ---------- Einstellungen ----------
  function viewSettings() {
    const s = S.settings, R = s.rating, V = s.vacation, dis = isAdmin() ? "" : "disabled";
    const sw = (id, on, label, desc) => `<div class="row"><label class="t" for="${id}">${label}</label><span class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""} ${dis}><span></span></span>${desc ? `<p>${desc}</p>` : ""}</div>`;
    return `
      <h1 class="section-title">WG-Einstellungen</h1>
      ${isAdmin() ? `<p class="lead">Du bist Admin. Änderungen gelten sofort für alle.</p>` : `<p class="lock">Nur ${esc(P(s.admin).name)} kann die Einstellungen ändern.${S.meta?.demo ? ` Wechsle oben zu ${esc(P(s.admin).short)}, um es auszuprobieren.` : ""}</p>`}
      <div class="settings">
        <section class="set">
          <h2>Wie werden Aufgaben verteilt?</h2>
          <div class="radios" role="radiogroup">
            <label><input type="radio" name="s-mode" value="plan" ${s.mode === "plan" ? "checked" : ""} ${dis}>Putzplan mit fester Reihenfolge</label>
            <label><input type="radio" name="s-mode" value="liste" ${s.mode === "liste" ? "checked" : ""} ${dis}>Aufgabenliste zum Selbernehmen</label>
          </div>
          <p class="hint">${s.mode === "plan" ? "Jede Woche ist eine andere Person dran. Wer im Urlaub ist, wird übersprungen." : "Jeder nimmt sich in der Woche Aufgaben selbst. Was übrig bleibt, wird an die verteilt, die am wenigsten Aufwand hatten."}</p>
          ${s.mode === "liste" ? `<div class="row"><label class="t" for="s-dist">Übrige Aufgaben verteilen am</label><select id="s-dist" class="sm" ${dis}>${[2, 3, 4].map(d => `<option value="${d}" ${s.distDay === d ? "selected" : ""}>${DAYS[d]}, 12 Uhr</option>`).join("")}</select></div>` : ""}
        </section>
        <section class="set">
          <h2>Aufgaben (${S.tasks.length})</h2>
          ${S.tasks.length ? S.tasks.map(t => `<div class="row trow"><span class="t" style="font-weight:600">${esc(t.title)}</span>${isAdmin() ? `<button type="button" class="btn small" data-tedit="${t.id}">Ändern</button>` : ""}<p>${isMulti(t) ? freqTxt(t) : `${everyTxt(t.every || 1)} · bis ${DAYS[t.due]}`} · ${"●".repeat(t.points)}${"○".repeat(3 - t.points)} ${PTS_TXT[t.points - 1]}${(t.every || 1) > 1 ? ` · nächstes Mal ${weekLabel(nextWeek(t))}` : ""}</p></div>`).join("") : `<p class="hint">Noch keine Aufgaben. Übernimm ein Paket oder lege selbst welche an.</p>`}
          ${isAdmin() ? `<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-market>Aufgabenpakete ansehen</button><button type="button" class="btn" data-tedit="new">Eigene Aufgabe anlegen</button></div>` : ""}
          <p class="hint">Der Aufwand bestimmt die Punkte in der Statistik und die Verteilung in der Aufgabenliste. Seltene Aufgaben werden über die Wochen verteilt, damit nicht alles auf einmal kommt.</p>
        </section>
        <section class="set">
          <h2>Bewertungen und Anmerkungen</h2>
          ${sw("s-r-notes", R.notes, "Anmerkungen erlauben", "Alle können zu erledigten Aufgaben einen kurzen Hinweis schreiben, und wer die Aufgabe gemacht hat, kann antworten.")}
          ${sw("s-r-on", R.enabled, "Erledigte Aufgaben bewerten", "Mitbewohner vergeben 1 bis 5 Sterne für erledigte Aufgaben.")}
          ${R.enabled ? `
          <div class="row"><span class="t" style="font-weight:600">Wer darf bewerten?</span><div class="radios"><label><input type="radio" name="s-r-who" value="alle" ${R.who === "alle" ? "checked" : ""} ${dis}>Alle</label><label><input type="radio" name="s-r-who" value="admin" ${R.who === "admin" ? "checked" : ""} ${dis}>Nur Admin</label></div></div>
          ${sw("s-r-stats", R.inStats, "Bewertungen in der Statistik zeigen", "")}` : ""}
          ${R.enabled || R.notes ? sw("s-r-anon", R.anonymous, "Anonym", "Bei Bewertungen sieht man nur den Durchschnitt, bei Anmerkungen nicht, wer sie geschrieben hat.") : ""}
        </section>
        <section class="set">
          <h2>Urlaub</h2>
          <div class="row"><label class="t" for="s-v-weeks">Standardurlaub pro Person und Jahr</label><span><input id="s-v-weeks" class="sm" type="number" min="0" max="12" value="${V.weeks}" ${dis}> Wochen</span><p>Wird ohne Zustimmung eingetragen.</p></div>
          <div class="row"><span class="t" style="font-weight:600">Zusätzlicher Urlaub braucht Zustimmung von</span><div class="radios"><label><input type="radio" name="s-v-appr" value="one" ${V.approval === "one" ? "checked" : ""} ${dis}>einer Person</label><label><input type="radio" name="s-v-appr" value="all" ${V.approval === "all" ? "checked" : ""} ${dis}>allen</label></div></div>
        </section>
        <section class="set">
          <h2>Mitglieder einladen</h2>
          <div class="row"><span class="t" style="font-weight:600">Einladungscode</span><button type="button" class="btn small" data-invite ${HHD?.info?.code ? "" : "disabled"}>Code und QR-Code zeigen</button><p>Neue Mitbewohner öffnen Flurfunk, wählen „Einer WG beitreten“ und geben den Code ein. Ihr Gerät holt sich die verschlüsselten WG-Daten vom Flurfunk-Server und entschlüsselt sie mit dem Code. Sie kommen ab der nächsten Woche in den Plan. Jeder in der WG kann einladen, weil jedes Gerät den Schlüssel kennt.</p></div>
          <div class="row"><span class="t">Jemand zieht aus?</span><p>Den Code zu wechseln (neuer Schlüssel für alle, die bleiben) kommt in einer späteren Version. Bis dahin: Wer den Code kennt, kann mitlesen.</p></div>
        </section>
        <section class="set">
          <h2>Admin</h2>
          <div class="row"><label class="t" for="s-admin">Admin der WG</label><select id="s-admin" class="sm" ${dis}>${S.parties.map(p => `<option value="${p.id}" ${s.admin === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select><p>Wenn du die Rolle abgibst, kannst du selbst nichts mehr ändern.</p></div>
        </section>
      </div>`;
  }

  // ---------- Vertretungen ----------
  function viewHilfe() {
    const wgJobs = S.jobs.filter(j => j.key);
    const open = wgJobs.filter(j => j.status === "open"), swaps = S.requests.filter(r => r.status === "open");
    const given = wgJobs.filter(j => ["confirmed", "done"].includes(j.status)).sort((a, b) => b.at - a.at);
    const swapped = S.requests.filter(r => r.status === "taken");
    const unpaid = j => j.status === "confirmed" || (j.status === "done" && !j.paid);
    const getIn = S.jobs.filter(j => j.taker === S.me && unpaid(j)).reduce((s, j) => s + j.price, 0);
    const payOut = S.jobs.filter(j => j.from === S.me && unpaid(j)).reduce((s, j) => s + j.price, 0);
    return `
      <h1 class="section-title">Vertretungen</h1>
      <p class="lead">Wer eine Aufgabe nicht schafft, gibt sie hier an die WG ab: als Gefallen oder gegen einen Betrag. Jeder in der WG kann übernehmen. Bezahlt wird direkt untereinander, Flurfunk ist daran nicht beteiligt.</p>
      <div class="cards">
        <div class="card"><h3>Offene Anfragen</h3><span class="amt">${open.length + swaps.length}</span></div>
        <div class="card"><h3>Du bekommst noch</h3><span class="amt">${eur(getIn)}</span></div>
        <div class="card"><h3>Du zahlst noch</h3><span class="amt">${eur(payOut)}</span></div>
      </div>
      <h2 class="sub-title">Offen</h2>
      ${open.length + swaps.length ? `<ul class="ledger">${open.map(jobLine).join("")}${swaps.map(swapLine).join("")}</ul>` : `<p class="hint">Gerade sucht niemand eine Vertretung.</p>`}
      <h2 class="sub-title">Vergeben</h2>
      ${given.length + swapped.length ? `<ul class="ledger">${given.map(jobLine).join("")}${swapped.map(swapLine).join("")}</ul>` : `<p class="hint">Noch keine Vertretungen.</p>`}`;
  }
  function jobLine(j) {
    const [t, wk] = splitKey(j.key), mine = j.from === S.me, who = j.taker;
    let act = "";
    if (j.status === "open") {
      if (mine) act = `<button type="button" class="btn quiet" data-jcancel="${j.id}">Zurückziehen</button>`;
      else if (canTake(S.me, j)) act = `<button type="button" class="btn help" data-take="${j.id}">${j.price ? `Übernehmen für ${eur(j.price)}` : "Übernehmen"}</button>`;
    }
    if (j.status === "confirmed" && mine) act = `<span class="pill help">zugesagt</span> <button type="button" class="btn quiet small" data-jcancel="${j.id}">Absagen</button>`;
    if (j.status === "confirmed" && who === S.me) act = `<button type="button" class="btn primary" data-jdone="${j.id}">Erledigt melden</button>`;
    if (j.status === "done") act = !j.price ? `<span class="pill done">erledigt</span>` : j.paid ? `<span class="pill done">bezahlt</span>` : mine ? `<button type="button" class="btn" data-jpaid="${j.id}">Als bezahlt markieren</button>` : `<span class="pill help">Zahlung offen</span>`;
    const st = j.status === "open" ? "" : ` · übernommen von ${esc(youOr(who))}${j.status === "done" ? ", erledigt" : ""}`;
    return `<li>${avatar(j.from)}<span class="grow"><b>${esc(t.title)}</b> · ${weekLabel(wk)}<br><span class="hint">${esc(youOr(j.from))} · ${priceTxt(j.price)} an die WG${st}</span></span>${act}</li>`;
  }
  function swapLine(r) {
    const [t, wk] = splitKey(r.key), mine = r.from === S.me;
    let act = "";
    if (r.status === "open" && r.to === S.me && !onVac(S.me, wk)) act = `<button type="button" class="btn help" data-take="${r.id}">Tausch annehmen</button>`;
    if (r.status === "open" && mine) act = `<button type="button" class="btn quiet" data-cancel="${r.id}">Zurückziehen</button>`;
    if (r.status === "taken") act = `<span class="pill done">getauscht</span>`;
    return `<li>${avatar(r.from)}<span class="grow"><b>${esc(t.title)}</b> · ${weekLabel(wk)}<br><span class="hint">${esc(youOr(r.from))} · Tausch mit ${esc(youOr(r.to))}</span></span>${act}</li>`;
  }

  const RULES = [
    ["Ruhezeiten", "Nachtruhe von 22 bis 6 Uhr, sonntags und an Feiertagen ganztägig. Bohren und laute Musik nur werktags von 8 bis 20 Uhr."],
    ["Küche", "Geschirr spätestens am nächsten Morgen abwaschen. Jeder hat ein eigenes Fach im Kühlschrank."],
    ["Müll", "Restmüll Dienstag, Bio Donnerstag, Papier und gelber Sack jede zweite Woche Mittwoch. Kartons zerkleinern."],
    ["Waschraum", "Waschmaschinen bis 21 Uhr. Wäsche nach dem Trocknen bitte am selben Tag abnehmen."],
    ["Gäste", "Übernachtungsgäste kurz im Flurfunk ankündigen. Länger als eine Woche nur nach Absprache."],
    ["Vertretung und Urlaub", "Wer seine Aufgabe nicht schafft, sorgt selbst für Ersatz. Urlaub wird in Flurfunk eingetragen, dann übernehmen die anderen."]
  ];
  const viewOrdnung = () => `
    <h1 class="section-title">Hausordnung</h1>
    <p class="lead">Die wichtigsten Regeln der WG, kurz zusammengefasst.</p>
    <div class="rules">${RULES.map(([h, p]) => `<div class="rule"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</div>`;

  function feedView() {
    return `
      <h2>Flurfunk <small>${esc(wgName())}</small></h2>
      <ul class="feed">${S.feed.slice(0, 12).map(f => `

  function shiftWeeks(hh, d) {
